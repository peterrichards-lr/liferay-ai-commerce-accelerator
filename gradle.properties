##
## Check GETTING_STARTED.md for additional properties and their default values.
##

liferay.workspace.bundle.dist.include.metadata=true
liferay.workspace.modules.dir=modules
liferay.workspace.themes.dir=themes
liferay.workspace.wars.dir=modules
microsoft.translator.subscription.key=
liferay.workspace.product=dxp-2026.q3.0

# Use yarn as the default package manager
liferay.workspace.node.package.manager=yarn

# Directories the Liferay Workspace plugin must not walk when discovering projects.
#
# **/aica*/** excludes the local aica LDM directory (update this if changing project name).
#
# .claude/** excludes the git worktrees agent isolation creates under
# .claude/worktrees/. Each is a full checkout, so the scan finds buildable
# directories beneath .claude, includes .claude itself as a project, and Gradle
# rejects any project name starting with a '.' - failing every task at
# configuration time. The glob must be root-anchored: **/.claude/** does NOT
# match here, which is the spelling to reach for first and the reason this note
# exists.
liferay.workspace.dir.excludes.globs=**/aica*/**,.claude/**

# Shared OSGi modules consumed from peterrichards-lr/liferay-custom-osgi-modules.
# Pinned deliberately: a bundle that fails to resolve does so quietly - the
# endpoint simply 404s, and only the boot log names it, via
# "DirectoryWatcher ... Could not resolve module" - so what we consume is
# explicit here rather than resolved at build time.
#
# A release is pinned rather than a bundle version. Each release publishes a
# modules.json naming every bundle's version, asset and checksum, so the build
# reads those instead of assembling filenames from naming rules owned by
# another repository. Requires v3.0.0 or later; earlier releases have no
# manifest.
aica.shared.osgi.repo=peterrichards-lr/liferay-custom-osgi-modules
aica.shared.osgi.release=v3.1.0

# Asserted against the manifest, not used to build a filename. This is the line
# the bundles were BUILT against, and it MUST match liferay.workspace.product
# above - the build fails if the two diverge.
#
# Divergence was permitted until 2026-09-09 on the grounds that these modules
# import only com.liferay.portal.kernel.*, whose package majors were assumed
# stable across lines. That is false. From dxp-2026.q1.12-lts to 2026.Q3.0,
# kernel model went 48 -> 51, search 22 -> 24, service 52 -> 54 and util
# 96 -> 100, so every consumed bundle failed to resolve on a Q3.0 portal.
#
# Two corollaries worth keeping in mind here:
#   - The ranges are hardcoded in each bnd.bnd upstream, so bumping a build
#     target alone does not close a gap; the ranges have to be edited.
#   - The OSGi resolver reports only the FIRST unsatisfied requirement, so one
#     package named in an error is not evidence that only one is stale.
#
# See docs/LOCAL_EXECUTION.md.
aica.shared.osgi.dxp.line=dxp-2026.q3.0
