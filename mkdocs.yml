site_name: Liferay AI Commerce Accelerator
# Kept under ~155 characters and led with the terms people actually search -
# "Liferay Commerce", "Liferay DXP" - rather than with a verb. Search engines
# truncate past that, and the previous wording spent its first word on
# "Generate". This string is also the og:description, so it is what a link
# unfurls as in Slack, Teams and LinkedIn.
site_description: >-
  Liferay Commerce demo data, generated with AI: seed catalogs, accounts and
  orders into Liferay DXP in minutes, with real-time monitoring.
site_author: Peter Richards

# The trailing slash and the repository subpath both matter. Without them the
# sitemap and the canonical links point at the domain root while Pages serves
# the site one level down, so every canonical URL is wrong.
site_url: https://peterrichards-lr.github.io/liferay-ai-commerce-accelerator/

repo_url: https://github.com/peterrichards-lr/liferay-ai-commerce-accelerator
repo_name: peterrichards-lr/liferay-ai-commerce-accelerator
edit_uri: edit/master/docs/

# Every file under docs_dir is published, whether or not it appears in `nav`.
# Leaving a document out of the navigation hides it; it does not withhold it.
# PLAYBOOK.md is internal - branch protection, release pipelines and backlog
# automation, for maintainers and agents - so it is excluded here and the three
# documents that link to it point at GitHub instead. See #1297.
exclude_docs: |
  PLAYBOOK.md
  requirements.txt

theme:
  name: material
  # Holds overrides/main.html, which fills Material's `extrahead` block with
  # the search-engine ownership tokens below. A template rather than a plugin,
  # because the tag has to be in every page's <head> and `extra` alone does not
  # reach the document.
  custom_dir: overrides
  language: en
  # The family mark: the shared hexagon frame with AICA's own glyph, so the
  # three Liferay tools sites read as siblings. `logo` is the light variant
  # because it sits on the navy header; `favicon` is the blue variant, which
  # is what a browser tab and a light background need.
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # navigation.instant makes this a single-page app: the <head> is NOT
    # re-evaluated on an internal click, which is why the ownership token and
    # the social tags are asserted on every built page rather than trusted to
    # a first load. See scripts/check-docs-rendered.sh.
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

# The shared palette, byte-identical across the three Liferay tools sites.
# Replaces docs/stylesheets/extra.css, which set four variables and left the
# header Liferay blue; the shared file is navy in both schemes and carries the
# contrast fix for dark-mode links, which #0B5FFF fails at 3.17:1 on navy.
# It also keeps the review-footer rule the old file had.
extra_css:
  - assets/stylesheets/liferay-blue.css

# Search-engine ownership tokens, rendered into every page's <head> by
# overrides/main.html. Add Bing's as `bing_site_verification:` the same way -
# the template already emits it as `msvalidate.01` when the key is present.
#
# The template renders each tag only when its key is set, so deleting one keeps
# the build green while quietly unverifying the property: Google re-checks
# ownership periodically and drops it when the tag goes. That is why
# scripts/check-docs-rendered.sh asserts the tag reached the built HTML rather
# than trusting this file. See #1312.
extra:
  google_site_verification: r7MfW8Y9zUhxsygop-Ubkr6dt7i9rUmddL4pEI26Ngk
  # An SVG favicon for browsers that take one; theme.favicon (PNG) stays as
  # the fallback. Emitted by overrides/main.html.
  favicon_svg: assets/favicon.svg
  # 1280x640, consumed by overrides/main.html for og:image and the Twitter
  # card. Set only now the file exists: the template guards on this key, so
  # setting it earlier would have emitted tags pointing at a 404.
  social_image: assets/social-preview.png

# Rendered as HTML in the site footer, on every page. Material has no dedicated
# slot for a disclosure link, and a theme override would be a whole custom
# partial to carry one anchor.
# The About link is NOT here. A relative href inside this string is raw HTML:
# MkDocs emits it verbatim on every page, so `about/` resolved against
# /QUICKSTART/ and 404'd on all 25 nested pages. overrides/partials/copyright.html
# appends it through the `url` filter instead, which resolves per page. See #1321.
copyright: >-
  A community project &mdash; not an official Liferay product

# Converts GitHub's `> [!NOTE]` blockquotes into Material admonitions at build
# time. The source stays GitHub-native, because that is where contributors read
# these files, and the site build translates. Shared with lfr-tunnel; AICA has
# no such markers today, so this is preventative rather than a fix.
hooks:
  - scripts/mkdocs_github_alerts.py

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      # A file with no commits yet - a new page in the PR that adds it - has no
      # git date to read. Falling back to the build time is wrong but visible;
      # failing the build on it would make every new page a two-commit dance.
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # CONTRIBUTING.md and CODE_OF_CONDUCT.md stay at the repository root, where
  # GitHub's own issue and pull request forms resolve them. They are included
  # here rather than copied, so there is one source and no file moves.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The top-level sections, their order and their labels are shared with the other
# two Liferay tools sites (liferay-docker-manager, lfr-tunnel) so a reader moving
# between them finds the same shelves in the same order. The split is Diataxis:
# Tutorials teach, How-to guides are recipes, Reference describes the machinery,
# Explanation gives the background. Omit a section that has no pages; never
# rename or reorder one. Asserted against the built nav by
# scripts/check-docs-rendered.sh. See #1333.
#
# This is a NAV-ONLY arrangement: no file moved, so no published URL changed.
# Several pages mix divisions and are filed by their dominant one - QUICKSTART
# carries packaging and troubleshooting past its first-run path, LOCAL_EXECUTION
# opens with an architecture overview, and SYSTEM_MAP ends with a WebSocket event
# contract. Splitting those is a content change, not a nav change, and is noted
# on #1333 instead.
nav:
  - Home: index.md
  - Tutorials:
      - Quick start: QUICKSTART.md
  - How-to guides:
      - Local execution: LOCAL_EXECUTION.md
      - SaaS targeting: SaaS_TARGETING_GUIDE.md
  - Reference:
      - Prompt templates: PROMPT_TEMPLATES.md
      - MCP server: MCP.md
      - JSON Web Services: JSONWS_GUIDE.md
      - Upstream bugs:
          - Index: upstream-bugs/index.md
          - GraphQL index lag: upstream-bugs/LPD-95082-GRAPHQL-INDEX-LAG.md
          - Account group parameters: upstream-bugs/LPD-DRAFT-ACCOUNT-GROUP-ASSOCIATION-SWAPPED-PARAMS.md
          - LDM CLI Traefik patch: upstream-bugs/LPD-DRAFT-LDM-CLI-TRAEFIK-HEADLESS-PATCH-BUG.md
          - Site initializer boot NPE: upstream-bugs/LPS-DRAFT-SITE-INITIALIZER-BOOT-NPE.md
          - Site initializer NPE before HTTP: upstream-bugs/LPS-DRAFT-SITE-INITIALIZER-NPE-BEFORE-HTTP.md
  - Explanation:
      - Features & capabilities: FEATURES.md
      - Architecture overview: ARCHITECTURE.md
      - System map: SYSTEM_MAP.md
      - Deep dives:
          - Index: deep-dives/README.md
          - Microservice: deep-dives/microservice-architecture.md
          - Frontend & UI: deep-dives/frontend-and-ui.md
          - Workflow & batching: deep-dives/workflow-and-batching.md
          - E2E & orchestration: deep-dives/e2e-and-orchestration.md
          - Liferay API constraints: deep-dives/liferay-api-constraints.md
      - Accelerator SDK (LDK): LDK_ARCHITECTURE.md
  - Project and contributing:
      - How to contribute: contributing.md
      - Code of conduct: code-of-conduct.md
  - About these docs: about.md

# PR 3 (#1297) adds the pages this navigation does not yet carry:
# getting-started/prerequisites.md, getting-started/configuration.md,
# using/cli.md, using/entity-resolution.md,
# using/dependency-aware-operations.md, deployment.md, testing.md and
# releases.md. They are absent from `nav` rather than stubbed, because a
# stub is a page that exists and says nothing, and `--strict` cannot tell
# the two apart.
