apply plugin: "com.liferay.node"

node {
	nodeVersion = "22.22.2"
	npmVersion = "10.9.7"
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import org.gradle.api.file.DuplicatesStrategy

def findNpmExecutable() {
	if (System.properties['os.name'].toLowerCase().contains('windows')) {
		return 'npm.cmd'

	}
	return 'npm'
}

def findYarnExecutable() {
	if (System.properties['os.name'].toLowerCase().contains('windows')) {
		return 'yarn.cmd'

	}
	return 'yarn'
}

tasks.register('createTomcatTempDir') {
	doLast {
		file("${rootDir}/bundles/tomcat/temp").mkdirs()
	}
}

tasks.named('clean') {
	doLast {
		file("${rootDir}/bundles/tomcat/temp").mkdirs()
	}
}

tasks.named('setUpYarn') {
	dependsOn 'createTomcatTempDir'
	doLast {
		def packageJsonFile = file("${rootDir}/package.json")
		if (packageJsonFile.exists()) {
			def jsonSlurper = new JsonSlurper()
			def packageJson = jsonSlurper.parse(packageJsonFile)
			if (packageJson.workspaces && packageJson.workspaces.packages) {
				def originalPackages = packageJson.workspaces.packages
				def cleanPackages = originalPackages.findAll { !it.startsWith("aica/") && !it.startsWith("aica-e2e/") }
				if (originalPackages.size() != cleanPackages.size()) {
					packageJson.workspaces.packages = cleanPackages
					packageJsonFile.write(JsonOutput.prettyPrint(JsonOutput.toJson(packageJson)))
					logger.lifecycle("🧹 Removed duplicate aica workspaces from package.json in setUpYarn hook")
				}
			}
		}
	}
}

tasks.named('yarnInstall') {
	doLast {
		try {
			exec {
				commandLine findYarnExecutable(), 'prettier', '--write', 'package.json'
			}
			logger.lifecycle("Formatted root package.json with Prettier")
		} catch (Exception e) {
			logger.warn("Failed to format package.json: ${e.message}")
		}
	}
}

// Bundles consumed from the shared OSGi modules repository. Named by
// Bundle-SymbolicName so that superseded versions can be pruned: two jars with
// the same symbolic name and different versions is a duplicate-bundle conflict,
// and the deploy directory is never cleaned on our behalf.
ext.sharedOsgiBundles = [
	"com.liferay.custom.client.extension.entry",
	"com.liferay.custom.commerce.site.type",
	"com.liferay.custom.search.reindex",
]

task downloadSharedOsgiModules (type: DefaultTask)

downloadSharedOsgiModules {
	group = "build"
	description = "Downloads pinned shared OSGi bundles into bundles/osgi/modules, verifying checksums."

	doLast {
		def repo = project.findProperty("aica.shared.osgi.repo")
		def release = project.findProperty("aica.shared.osgi.release")
		def expectedDxpLine = project.findProperty("aica.shared.osgi.dxp.line")

		if (!repo || !release || !expectedDxpLine) {
			throw new GradleException(
				"aica.shared.osgi.{repo,release,dxp.line} must all be set in gradle.properties")
		}

		// The manifest check below compares the release against
		// aica.shared.osgi.dxp.line, a declared value. That catches a bad
		// release but not a bad declaration: if dxp.line drifts from
		// liferay.workspace.product, bundles built for one line land in a
		// portal running another, resolve nowhere, and the endpoints 404. That
		// is exactly how q1.12-lts bundles reached a 2026.Q3.0 portal on
		// 2026-09-09. Tie the two together so the hazard cannot recur silently.
		def workspaceProduct = project.findProperty("liferay.workspace.product")

		if (workspaceProduct && workspaceProduct != expectedDxpLine) {
			throw new GradleException(
				"aica.shared.osgi.dxp.line is ${expectedDxpLine} but " +
				"liferay.workspace.product is ${workspaceProduct}. The shared bundles " +
				"would be built for a different Liferay line than the one this " +
				"workspace runs, and would fail to resolve. Move both together.")
		}

		// ...and the check above still compares a declaration to a
		// declaration. Both properties can agree while the portal actually
		// installed under bundles/ is on another line entirely -- which was the
		// state of this workspace the moment both were moved to q3.0, with a
		// 2026.Q1.12 LTS bundle still in place. That stages Q3.0 bundles into a
		// Q1.12 portal: the same resolution failure this pin exists to prevent,
		// just on a laptop instead of Liferay Cloud.
		//
		// portal-impl.jar's own manifest is the only ground truth available
		// here, and it needs no network. Skipped when no bundle is initialised,
		// so a fresh clone is unaffected.
		def portalImplJar = fileTree("$rootDir/bundles/tomcat/webapps/ROOT/WEB-INF") {
			include "**/portal-impl.jar"
		}.files.find()

		if (portalImplJar) {
			def installedLine = new java.util.zip.ZipFile(portalImplJar).withCloseable {
				zip ->
				def entry = zip.getEntry("META-INF/MANIFEST.MF")
				entry ? new java.util.jar.Manifest(zip.getInputStream(entry))
					.mainAttributes.getValue("Liferay-Portal-Version-Display-Name") : null
			}

			// "dxp-2026.q1.12-lts" and "2026.Q1.12 LTS" describe one line in
			// two spellings; compare them with the punctuation and case removed
			// rather than trying to reconstruct either format.
			def normalise = {
				String v ->
				v?.toLowerCase()?.replaceFirst(/^dxp-/, "")?.replaceAll(/[^a-z0-9.]/, "")
			}

			if (installedLine && normalise(installedLine) != normalise(expectedDxpLine)) {
				throw new GradleException(
					"The Liferay bundle installed under bundles/ is ${installedLine}, but " +
					"aica.shared.osgi.dxp.line is ${expectedDxpLine}. The shared bundles " +
					"would be staged into a portal on a different line and would fail to " +
					"resolve. Re-initialise the bundle for ${expectedDxpLine}, or move the " +
					"pin back to match what is installed.")
			}
		}

		def targetDir = file("$rootDir/bundles/osgi/modules")
		targetDir.mkdirs()

		def base = "https://github.com/${repo}/releases/download/${release}"

		def digestOf = {
			File f ->
			def md = java.security.MessageDigest.getInstance("SHA-256")
			f.eachByte(64 * 1024) {
				buf, len ->
				md.update(buf, 0, len)
			}
			md.digest().collect { String.format("%02x", it) }.join()
		}

		// A transient failure on one asset used to abort this task, and with it
		// every deploy and build in the workspace (#726).
		def fetchBytes = {
			String url ->
			def attempts = 3
			def lastFailure = null

			for (int attempt = 1; attempt <= attempts; attempt++) {
				try {
					return new URL(url).withInputStream { it.bytes }
				}
				catch (Exception e) {
					lastFailure = e

					if (attempt < attempts) {
						logger.lifecycle(
							"Fetch of ${url} failed (${e.message}); retrying")
						Thread.sleep(1000L * attempt)
					}
				}
			}

			throw lastFailure
		}

		def fetchText = {
			String url ->
			new String(fetchBytes(url), "UTF-8")
		}

		// One fetch resolves every bundle: its version, its asset name and its
		// checksum. Before the release manifest existed this was a .sha256
		// request per bundle, and the version and DXP line had to be assembled
		// into a filename here - which meant this file encoded naming rules
		// owned by another repository.
		def manifestText
		try {
			manifestText = fetchText("${base}/modules.json")
		}
		catch (Exception e) {
			throw new GradleException(
				"Could not fetch modules.json from ${base}. Is ${release} published, and does it " +
				"carry a release manifest? Releases before v3.0.0 do not.", e)
		}

		// The manifest's own checksum is same-origin, so it proves the download
		// arrived intact rather than that it is authentic. The per-bundle
		// digests below are the values worth trusting.
		def manifestActual = java.security.MessageDigest.getInstance("SHA-256")
			.digest(manifestText.getBytes("UTF-8"))
			.collect { String.format("%02x", it) }.join()

		// Which is why an unreachable one warns rather than stopping every build
		// in the workspace - GitHub served a persistent 500 for this single asset
		// while every other asset in the release was fine (#726). A checksum that
		// is present and *disagrees* still fails: that is corruption, which an
		// unreachable file is not.
		def manifestExpected = null

		try {
			manifestExpected = fetchText("${base}/modules.json.sha256").trim().split(/\s+/)[0]
		}
		catch (Exception e) {
			logger.warn(
				"Could not fetch modules.json.sha256 from ${base} (${e.message}). Continuing " +
				"without the manifest's own checksum; the per-bundle digests it carries are " +
				"still enforced.")
		}

		if (manifestExpected != null && manifestExpected != manifestActual) {
			throw new GradleException(
				"modules.json failed its own checksum: expected ${manifestExpected}, got ${manifestActual}")
		}

		def manifest = new JsonSlurper().parseText(manifestText)

		// Refuse a schema this task was not written against rather than reading
		// fields that may have moved. See liferay-custom-osgi-modules#22.
		if (manifest.schemaVersion != 1) {
			throw new GradleException(
				"modules.json declares schemaVersion ${manifest.schemaVersion}; this build understands 1")
		}

		def retired = [] as Set

		sharedOsgiBundles.each {
			bundleName ->

			def entry = manifest.bundles?.get(bundleName)

			if (!entry) {
				throw new GradleException(
					"Release ${release} does not contain bundle ${bundleName}. " +
					"It publishes: ${manifest.bundles?.keySet()?.sort()?.join(', ')}")
			}

			// A bundle built against a different DXP line resolves silently -
			// the endpoint simply 404s - so a mismatch is caught here rather
			// than at runtime. The manifest reports this per bundle, so a
			// release that builds one module differently is visible.
			if (entry.dxpLine != expectedDxpLine) {
				throw new GradleException(
					"${bundleName} in ${release} was built against ${entry.dxpLine}, " +
					"but aica.shared.osgi.dxp.line is ${expectedDxpLine}")
			}

			// Bundles this one supersedes. Liferay resolves by symbolic name,
			// so a renamed bundle is a *different* bundle and its old jar is
			// never overwritten or pruned by version - it simply stays, and
			// both register their endpoints. Collected from the manifest so
			// that a rename in the shared repository does not require a list
			// maintained by hand here.
			retired.addAll(entry.replaces ?: [])

			def fileName = entry.asset
			def target = new File(targetDir, fileName)
			def expected = entry.sha256

			if (target.exists() && digestOf(target) == expected) {
				logger.lifecycle("Shared OSGi bundle already present and verified: ${fileName}")
			}
			else {
				logger.lifecycle("Downloading ${fileName}")
				target.bytes = fetchBytes("${base}/${fileName}")

				def actual = digestOf(target)

				if (actual != expected) {
					target.delete()
					throw new GradleException(
						"Checksum mismatch for ${fileName}: expected ${expected}, got ${actual}")
				}

				logger.lifecycle("Verified ${fileName}")
			}

			// Remove other versions of the same bundle. Liferay resolves by
			// Bundle-SymbolicName, so leaving an older jar behind deploys two
			// bundles that claim the same name.
			targetDir.listFiles().each {
				existing ->

				if (existing.name.endsWith(".jar") &&
					existing.name.startsWith("${bundleName}-") &&
					existing.name != fileName) {

					logger.lifecycle("Removing superseded ${existing.name}")
					existing.delete()
				}
			}
		}

		// Remove bundles that the consumed ones replace. Only the predecessors
		// of bundles we actually deploy are pruned: another adopter's rename is
		// none of our business, and deleting a jar we never installed would be
		// guesswork.
		retired.each {
			retiredBsn ->

			targetDir.listFiles().each {
				existing ->

				if (existing.name.endsWith(".jar") &&
					existing.name.startsWith("${retiredBsn}-")) {

					logger.lifecycle("Removing retired ${existing.name}, superseded by a renamed bundle")
					existing.delete()
				}
			}

			// Liferay strips the version from a deployed jar, so the retired
			// bundle may also be sitting in the deploy directory under a bare
			// symbolic name.
			def deployed = new File(targetDir, "${retiredBsn}.jar")

			if (deployed.exists()) {
				logger.lifecycle("Removing retired ${deployed.name}, superseded by a renamed bundle")
				deployed.delete()
			}
		}
	}
}

task generateBatchFiles (type: DefaultTask)

generateBatchFiles {
	group = 'build'
	description = 'Generates Liferay batch engine files from generation schemas and AI prompts.'

	doFirst {
		def batchDir = file("$rootDir/client-extensions/ai-commerce-accelerator-batch/batch")
		logger.lifecycle("Deleting old generated batch files in ${batchDir}")
		if (batchDir.exists()) {
			batchDir.eachFile {
				file ->
				if (file.name.contains("-object-entry-ai-schema-") ||
				    file.name.contains("-object-entry-generation-schema-") ||
				    file.name.contains("-object-entry-ai-prompt-") ||
				    file.name.contains("-object-entry-ai-categories") ||
				    file.name.contains("-object-entry-ai-model-options") ||
				    file.name.contains("-object-entry-batch-sizes") ||
				    file.name.contains("-object-entry-ai-chunk-sizes")) {
					logger.debug("Deleting ${file.name}")
					file.delete()
				}
			}
		}
	}

	doLast {
		def minifyJsonString = {
			jsonString ->
			def jsonObject = new JsonSlurper().parseText(jsonString)
			return groovy.json.JsonOutput.toJson(jsonObject)
		}

		def microserviceDir = file("$rootDir/client-extensions/ai-commerce-accelerator-microservice")
		def batchDir = file("$rootDir/client-extensions/ai-commerce-accelerator-batch/batch")

		// The directories are the source of truth for what gets seeded: a
		// hand-maintained list silently drops any file added to them, which is
		// how prompts/image.md ended up unseeded. The two sets differ on
		// purpose - image generation has a prompt but returns no structured
		// output, so there is no generation-schemas/image.json.
		def entitiesIn = {
			dir, extension ->
			if (!dir.exists()) {
				return []
			}

			return dir.listFiles().findAll {
				it.isFile() && it.name.endsWith(extension)
			}.collect {
				it.name.substring(0, it.name.length() - extension.length())
			}.sort()
		}

		def entityLabel = {
			entity ->
			(entity == 'promo') ? 'Promotion' : (entity == 'names') ? 'Product Names' : entity.capitalize()
		}

		int fileIndex = 4

		// --- Schemas ---
		def schemaDir = file("$microserviceDir/generation-schemas")
		entitiesIn(schemaDir, '.json').each {
			entity ->
			def inputFile = file("$schemaDir/${entity}.json")
			def entityName = entityLabel(entity)
			def content = inputFile.text

			def batchJson = [
				configuration: [
					className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
					parameters: [
						containsHeaders: "true",
						createStrategy: "UPSERT",
						onErrorFail: "false",
						taskItemDelegateName: "C_AICAConfiguration",
						updateStrategy: "UPDATE"
					],
					taskItemDelegateName: "C_AICAConfiguration"
				],
				items: [
					[
						configKey: "ai-schema-${entity}",
						configStatus: [ key: "Active" ],
						configValue: minifyJsonString(content),
						description: "AI Schema for ${entityName}",
						externalReferenceCode: "AI-SCHEMA-${entity.toUpperCase()}"
					]
				]
			]

			def fileName = String.format("%02d-object-entry-ai-schema-%s.batch-engine-data.json", fileIndex++, entity)
			def outputFile = new File(batchDir, fileName)
			outputFile.withWriter('UTF-8') {
				writer ->
				writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))
			}
			logger.lifecycle("Generated batch file: ${outputFile.name}")
		}

		// --- Prompts ---
		def promptDir = file("$microserviceDir/prompts")
		entitiesIn(promptDir, '.md').each {
			entity ->
			def inputFile = file("$promptDir/${entity}.md")
			def entityName = entityLabel(entity)
			def content = inputFile.text

			def batchJson = [
				configuration: [
					className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
					parameters: [
						containsHeaders: "true",
						createStrategy: "UPSERT",
						onErrorFail: "false",
						taskItemDelegateName: "C_AICAConfiguration",
						updateStrategy: "UPDATE"
					],
					taskItemDelegateName: "C_AICAConfiguration"
				],
				items: [
					[
						configKey: "ai-prompt-${entity}",
						configStatus: [ key: "Active" ],
						configValue: content,
						description: "AI Prompt for ${entityName}",
						externalReferenceCode: "AI-PROMPT-${entity.toUpperCase()}"
					]
				]
			]

			def fileName = String.format("%02d-object-entry-ai-prompt-%s.batch-engine-data.json", fileIndex++, entity)
			def outputFile = new File(batchDir, fileName)
			outputFile.withWriter('UTF-8') {
				writer ->
				writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))
			}
			logger.lifecycle("Generated batch file: ${outputFile.name}")
		}

		// --- Categories ---
		def frontendConfigDir = file("$rootDir/client-extensions/ai-commerce-accelerator-frontend/src/config")
		if (frontendConfigDir.exists()) {
			def categoryFile = file("$frontendConfigDir/categories.json")
			if (categoryFile.exists()) {
				def content = categoryFile.text
				def configKey = "ai-categories" // New config key

				def batchJson = [
					configuration: [
						className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
						parameters: [
							containsHeaders: "true",
							createStrategy: "UPSERT",
							onErrorFail: "false",
							taskItemDelegateName: "C_AICAConfiguration",
							updateStrategy: "UPDATE"
						],
						taskItemDelegateName: "C_AICAConfiguration"
					],
					items: [
						[
							configKey: configKey,
							configStatus: [ key: "Active" ],
							configValue: minifyJsonString(content),
							description: "AI Product Categories",
							externalReferenceCode: "AI-CATEGORIES"
						]
					]
				]

				def fileName = String.format("%02d-object-entry-%s.batch-engine-data.json", fileIndex++, configKey)
				def outputFile = new File(batchDir, fileName)
				outputFile.withWriter('UTF-8') {
					writer ->
					writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))

				}
				logger.lifecycle("Generated batch file: ${outputFile.name}")

			}

		}

		// --- AI Model Options ---
		def aiModelOptionsFile = file("$frontendConfigDir/ai-models.json")
		if (aiModelOptionsFile.exists()) {
			def content = aiModelOptionsFile.text
			def configKey = "ai-model-options"

			def batchJson = [
				configuration: [
					className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
					parameters: [
						containsHeaders: "true",
						createStrategy: "UPSERT",
						onErrorFail: "false",
						taskItemDelegateName: "C_AICAConfiguration",
						updateStrategy: "UPDATE"
					],
					taskItemDelegateName: "C_AICAConfiguration"
				],
				items: [
					[
						configKey: configKey,
						configStatus: [ key: "Active" ],
						configValue: minifyJsonString(content),
						description: "AI Model Options",
						externalReferenceCode: "AI-MODEL-OPTIONS"
					]
				]
			]

			def fileName = String.format("%02d-object-entry-%s.batch-engine-data.json", fileIndex++, configKey)
			def outputFile = new File(batchDir, fileName)
			outputFile.withWriter('UTF-8') {
				writer ->
				writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))

			}
			logger.lifecycle("Generated batch file: ${outputFile.name}")

		}

		// --- Batch Sizes ---
		def batchSizesFile = file("$frontendConfigDir/batch-sizes.json")
		if (batchSizesFile.exists()) {
			def content = batchSizesFile.text
			def configKey = "batch-sizes"

			def batchJson = [
				configuration: [
					className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
					parameters: [
						containsHeaders: "true",
						createStrategy: "UPSERT",
						onErrorFail: "false",
						taskItemDelegateName: "C_AICAConfiguration",
						updateStrategy: "UPDATE"
					],
					taskItemDelegateName: "C_AICAConfiguration"
				],
				items: [
					[
						configKey: configKey,
						configStatus: [ key: "Active" ],
						configValue: minifyJsonString(content),
						description: "Batch Sizes",
						externalReferenceCode: "BATCH-SIZES"
					]
				]
			]

			def fileName = String.format("%02d-object-entry-%s.batch-engine-data.json", fileIndex++, configKey)
			def outputFile = new File(batchDir, fileName)
			outputFile.withWriter('UTF-8') {
				writer ->
				writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))

			}
			logger.lifecycle("Generated batch file: ${outputFile.name}")

		}

		// --- AI Chunk Sizes ---
		def aiChunkSizesFile = file("$frontendConfigDir/ai-chunk-sizes.json")
		if (aiChunkSizesFile.exists()) {
			def content = aiChunkSizesFile.text
			def configKey = "ai-chunk-sizes"

			def batchJson = [
				configuration: [
					className: "com.liferay.object.rest.dto.v1_0.ObjectEntry",
					parameters: [
						containsHeaders: "true",
						createStrategy: "UPSERT",
						onErrorFail: "false",
						taskItemDelegateName: "C_AICAConfiguration",
						updateStrategy: "UPDATE"
					],
					taskItemDelegateName: "C_AICAConfiguration"
				],
				items: [
					[
						configKey: configKey,
						configStatus: [ key: "Active" ],
						configValue: minifyJsonString(content),
						description: "AI Chunk Sizes",
						externalReferenceCode: "AI-CHUNK-SIZES"
					]
				]
			]

			def fileName = String.format("%02d-object-entry-%s.batch-engine-data.json", fileIndex++, configKey)
			def outputFile = new File(batchDir, fileName)
			outputFile.withWriter('UTF-8') {
				writer ->
				writer.write(JsonOutput.prettyPrint(JsonOutput.toJson(batchJson)))

			}
			logger.lifecycle("Generated batch file: ${outputFile.name}")

		}

		// --- Format generated files ---
		try {
			exec {
				commandLine 'npx', 'prettier', '--write', batchDir.absolutePath
			}
			logger.lifecycle("Formatted generated batch files with Prettier")
		} catch (Exception e) {
			logger.warn("Failed to format batch files: ${e.message}")
		}

	}
}

// ======================================================================

def CX_DIR = file(findProperty('cx.dir') ?: "$rootDir/client-extensions/ai-commerce-accelerator-frontend")
def FRAGMENTS_DIR = file(findProperty('fragments.dir') ?: "$rootDir/client-extensions/ai-commerce-accelerator-site-initializer/site-initializer/fragments/group/ai-commerce-accelerator-fragments")
def FRAGMENT_DIR = file(findProperty('fragment.dir') ?: "$rootDir/client-extensions/ai-commerce-accelerator-site-initializer/site-initializer/fragments/group/ai-commerce-accelerator-fragments/fragments/ai-commerce-accelerator")
def FRAGMENT_ADMIN_DIR = file(findProperty('fragment.admin.dir') ?: "$rootDir/client-extensions/ai-commerce-accelerator-site-initializer/site-initializer/fragments/group/ai-commerce-accelerator-fragments/fragments/ai-commerce-accelerator-admin")

def FRAGMENTS_ZIP_NAME = "ai-accelerator-fragments.zip"
def FRAGMENTS_ZIP_OUT = layout.buildDirectory.dir("fragments")

// Import scope (GLOBAL by default)
def COMPANY_WEB_ID = (findProperty('companyWebId') ?: '*')
def GROUP_KEY = (findProperty('groupKey') ?: null)

// liferay.home (defaults to ./bundles)
def liferayHome = providers.gradleProperty('liferay.home').orElse("$rootDir/bundles")

// Detect package manager
def useYarn = new File(CX_DIR, "yarn.lock").exists()
def useNpmCi = new File(CX_DIR, "package-lock.json").exists()

// Generated files
