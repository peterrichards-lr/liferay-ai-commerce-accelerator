name: Docs

# Runs on EVERY pull request, deliberately.
#
# `ci.yml` gates `build-and-test` behind a paths filter that excludes
# `**/*.md` and `docs/**`, so a docs-only pull request skips it entirely. Any
# documentation guard added there would therefore never run on the pull
# requests that change documentation - a check that cannot see its own subject.
#
# The expensive half (pip install plus a full site build) is still gated on
# paths, using the same filter/skip idiom as `ci.yml`: `docs/build` and
# `docs/build-skip` share one display name, so the check reports on every pull
# request and can be made required later without leaving unrelated ones
# waiting forever. The cheap half - the two guards that back the claims on the
# About page - runs unconditionally, because a code change can make a document
# stale just as easily as editing it can.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              # The theme's custom_dir. A Jinja error here, or a deleted
              # verification tag, breaks every page's <head> with no docs/
              # change at all - and without this line the strict build would
              # be skipped and the broken site deployed anyway. See #1312.
              - 'overrides/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - '.github/workflows/docs.yml'

  # The two guards the docs About page publicly commits to. Not gated: see the
  # note at the top of this file.
  review:
    name: docs/review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-file check below diffs this branch against its base,
          # so the base commit has to be present.
          fetch-depth: 0

      # Backs "each page shows when it was last reviewed" and "reviews are
      # carried out by the agents as part of keeping the docs current".
      # Without --max-review-days the script only checks that a footer exists,
      # which would let every page rot while reporting success.
      - name: Check documentation review dates
        run: python3 scripts/check_docs_review.py --max-review-days 180

      # `yarn lint:md` checks markdown style, not whether the documentation is
      # true. This one has existed since #1057 and was wired to `yarn
      # lint:docs`, which `ci.yml` never ran - so it has never gated anything.
      # It needs no dependencies, only node builtins.
      - name: Check documentation links
        run: node scripts/check-docs-links.cjs

      # --max-review-days catches a page nobody has looked at for months. It
      # cannot catch a file edited today whose footer still shows last month,
      # because that date is not yet stale - which is exactly what happened in
      # #1298: the commit adding the README disclaimer changed five lines and
      # left the footer at 2026-09-18, and every check passed.
      #
      # Pull requests only. On a push to master the branch and the base are the
      # same commit, so there is nothing to compare.
      - name: Check changed documentation was re-reviewed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=0 origin "$BASE" 2>/dev/null || true
          python3 scripts/check_docs_review.py --changed-since "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

  build:
    name: docs/build
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # mkdocs-git-revision-date-localized reads each file's commit history
          # to generate "Last updated". A shallow clone has none, so the plugin
          # falls back to the build time: every page would claim it was updated
          # today, and the site would assert something false on every page
          # while the build stayed green.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      # --strict turns every warning into a failure: a broken cross-reference,
      # a nav entry pointing at nothing, a page with no git history. Without
      # it a link rots and the build stays green.
      - name: Build the site
        run: mkdocs build --strict

      # --strict asserts the build did not warn. It says nothing about what
      # landed in the output, and the ownership token is rendered only when its
      # key is set - so deleting the key builds clean and silently unverifies
      # the property. This reads the built HTML instead. See #1312.
      - name: Check the rendered output
        run: bash scripts/check-docs-rendered.sh site

      # Uploaded on pull requests too, deliberately. It costs one step, and it
      # means a reviewer can download exactly what the deploy would publish
      # rather than inferring it from a green tick.
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Shares the display name with `build` so the check reports on every pull
  # request. Same reasoning as `build-and-test-skip` in `ci.yml`.
  build-skip:
    name: docs/build
    needs: filter
    if: needs.filter.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No documentation changes; the site build is not needed."

  # Publishes what `build` produced. Never runs on a pull request: a fork's
  # pull request would otherwise be able to replace the published site.
  deploy:
    name: docs/deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # A job-level `permissions` block replaces the workflow-level one rather
    # than adding to it, so `contents: read` is restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
