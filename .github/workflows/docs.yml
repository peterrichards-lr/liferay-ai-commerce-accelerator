name: Docs

# Runs on EVERY pull request, deliberately.
#
# `ci.yml` gates `build-and-test` behind a paths filter that excludes
# `**/*.md` and `docs/**`, so a docs-only pull request skips it entirely. Any
# documentation guard added there would therefore never run on the pull
# requests that change documentation - a check that cannot see its own subject.
#
# The expensive half (pip install plus a full site build) is still gated on
# paths, using the same filter/skip idiom as `ci.yml`: `docs/build` and
# `docs/build-skip` share one display name, so the check reports on every pull
# request and can be made required later without leaving unrelated ones
# waiting forever. The cheap half - the two guards that back the claims on the
# About page - runs unconditionally, because a code change can make a document
# stale just as easily as editing it can.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              # The theme's custom_dir. A Jinja error here, or a deleted
              # verification tag, breaks every page's <head> with no docs/
              # change at all - and without this line the strict build would
              # be skipped and the broken site deployed anyway. See #1312.
              - 'overrides/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - '.github/workflows/docs.yml'
              # The guards the build itself runs. Without these, editing
              # check-docs-rendered.sh skips the very build that executes it:
              # `docs/build` reports green from build-skip, which prints "No
              # documentation changes" and does nothing. A change to a check,
              # verified by not running the check. Caught on #1317, whose own
              # strengthened guard was never executed on its own pull request.
              - 'scripts/check-docs-*'
              - 'scripts/check_docs_*'
              # The build-time hook. It rewrites page markdown, so a change
              # here changes every page of the published site.
              - 'scripts/mkdocs_github_alerts.py'
              - 'scripts/check_template_drift.py'

  # The two guards the docs About page publicly commits to. Not gated: see the
  # note at the top of this file.
  review:
    name: docs/review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-file check below diffs this branch against its base,
          # so the base commit has to be present.
          fetch-depth: 0

      # Backs "each page shows when it was last reviewed" and "reviews are
      # carried out by the agents as part of keeping the docs current".
      # Without --max-review-days the script only checks that a footer exists,
      # which would let every page rot while reporting success.
      - name: Check documentation review dates
        run: python3 scripts/check_docs_review.py --max-review-days 180

      # `yarn lint:md` checks markdown style, not whether the documentation is
      # true. This one has existed since #1057 and was wired to `yarn
      # lint:docs`, which `ci.yml` never ran - so it has never gated anything.
      # It needs no dependencies, only node builtins.
      - name: Check documentation links
        run: node scripts/check-docs-links.cjs

      # Ungated on purpose, like the guards above it. The canonical copies live
      # in another repository, so this one can drift without any file here
      # changing - a `prettier --write`, or a well-meant comment fix - and a
      # paths filter would hide exactly those cases.
      #
      # --against-recorded, like the deploy gate, since ai-agent-template#168.
      # It asks "did WE edit a copy?", and a template release no longer turns
      # this red: the checker prints a newer release as a NOTICE naming the
      # files it changes. Comparing against HEAD here meant master sat red from
      # the moment upstream merged anything until a sync PR landed - four times
      # in one morning - and a permanently red check is one people stop reading.
      # See #1345.
      #
      # Skipped on Dependabot's pull requests: a dependency bump changes no
      # shared file, so there is nothing here to check. Those pull requests
      # still build the site and run the rendered check, because a dependency
      # bump is exactly what breaks rendering. On a push,
      # github.event.pull_request is empty and the step runs.
      - name: We have not edited a shared docs file
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          recorded=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; from check_template_drift import UNKNOWN_STAMP_VALUE, parse_template_reference; commit = parse_template_reference(Path(".agents/TEMPLATE_REF.md").read_text(encoding="utf-8")).commit; print("" if commit == UNKNOWN_STAMP_VALUE else commit)')
          if [ -n "$recorded" ]; then
            echo "Comparing against the recorded commit $recorded."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift --against-recorded
          else
            echo "The stamp records no commit yet (unknown): comparing against upstream HEAD."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift
          fi

      # --max-review-days catches a page nobody has looked at for months. It
      # cannot catch a file edited today whose footer still shows last month,
      # because that date is not yet stale - which is exactly what happened in
      # #1298: the commit adding the README disclaimer changed five lines and
      # left the footer at 2026-09-18, and every check passed.
      #
      # Pull requests only. On a push to master the branch and the base are the
      # same commit, so there is nothing to compare.
      - name: Check changed documentation was re-reviewed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=0 origin "$BASE" 2>/dev/null || true
          python3 scripts/check_docs_review.py --changed-since "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}

  build:
    name: docs/build
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # mkdocs-git-revision-date-localized reads each file's commit history
          # to generate "Last updated". A shallow clone has none, so the plugin
          # falls back to the build time: every page would claim it was updated
          # today, and the site would assert something false on every page
          # while the build stayed green.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      # --strict turns every warning into a failure: a broken cross-reference,
      # a nav entry pointing at nothing, a page with no git history. Without
      # it a link rots and the build stays green.
      - name: Build the site
        run: mkdocs build --strict

      # The two assertions the shared check does not make: that the
      # verification tag carries the CONFIGURED value rather than merely being
      # present, and that the branding assets resolve. See #1312 and #1321.
      - name: Check the rendered output (this repo's own assertions)
        run: bash scripts/check-docs-rendered.sh site

      # The family check, copied verbatim from ai-agent-template and configured
      # through extra.docs_standard in mkdocs.yml. It replaced seven of the nine
      # assertions this repository used to carry in check-docs-rendered.sh; the
      # two that are left are the ones it does not make. See #1335.
      # --against-recorded here, HEAD in `docs/review`. This is the deploy path,
      # and the two questions are different:
      #
      #   docs/review  "has upstream moved?"   -> compares against upstream HEAD
      #   docs/build   "did WE edit a copy?"   -> compares against the commit
      #                                           recorded in TEMPLATE_REF.md
      #
      # A local edit still fails here; an upstream merge cannot. Without it the
      # deploy breaks whenever the template merges anything, which is not a fact
      # about this repository - it happened twice in one morning during #1335
      # and #1337. The template's docs-site-standard skill, rule 4, states this
      # split. See #1339.
      #
      # Before the rendered check, not after: a step only runs if the one above
      # it passed, and the first run of this workflow skipped the drift check
      # entirely because UNDATED-PAGE failed above it.
      # Taken from the template's own docs.yml (ai-agent-template#157, #168).
      # --against-recorded needs a real commit in the stamp and exits 3 on
      # `unknown`, so it falls back to the HEAD comparison until one is
      # recorded. This repo's stamp has been real since #1335, so the fallback
      # should never fire here - it is kept because the template's logic is the
      # thing being adopted, and a stamp can be reset. The stamp is read with
      # the drift checker's OWN parser, so the workflow and the checker cannot
      # disagree about its format - which they did once already: `v2.2.0`+2 was
      # unparseable and the check refused to compare anything (#1339).
      - name: We have not edited a shared docs file
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          recorded=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; from check_template_drift import UNKNOWN_STAMP_VALUE, parse_template_reference; commit = parse_template_reference(Path(".agents/TEMPLATE_REF.md").read_text(encoding="utf-8")).commit; print("" if commit == UNKNOWN_STAMP_VALUE else commit)')
          if [ -n "$recorded" ]; then
            echo "Comparing against the recorded commit $recorded."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift --against-recorded
          else
            echo "The stamp records no commit yet (unknown): comparing against upstream HEAD."
            python3 scripts/check_template_drift.py --docs-site --fail-on-drift
          fi

      # The family check, copied verbatim from ai-agent-template and configured
      # through extra.docs_standard in mkdocs.yml.
      #
      # It carried an allowance for UNDATED-PAGE between #1335 and this change,
      # because the check wanted both dates in the page body while this site
      # lets mkdocs-git-revision-date-localized generate one of them.
      # ai-agent-template#145 taught it to read Material's source-file aside,
      # so the allowance is gone and the step is plain again.
      - name: Check the rendered output against the shared standard
        run: python3 scripts/check_docs_rendered.py site

      # Uploaded on pull requests too, deliberately. It costs one step, and it
      # means a reviewer can download exactly what the deploy would publish
      # rather than inferring it from a green tick.
      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Shares the display name with `build` so the check reports on every pull
  # request. Same reasoning as `build-and-test-skip` in `ci.yml`.
  build-skip:
    name: docs/build
    needs: filter
    if: needs.filter.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No documentation changes; the site build is not needed."

  # Publishes what `build` produced. Never runs on a pull request: a fork's
  # pull request would otherwise be able to replace the published site.
  deploy:
    name: docs/deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # A job-level `permissions` block replaces the workflow-level one rather
    # than adding to it, so `contents: read` is restated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
