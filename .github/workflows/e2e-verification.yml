name: E2E Verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      node_target:
        description: 'LDM Target Node (local, aws-1, aws-2)'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - aws-1
          - aws-2
  schedule:
    # Nightly. Skipped automatically (see check-for-changes below) if
    # nothing has landed on the default branch since the last successful run,
    # so we're not burning ~1.5h of runner time verifying unchanged code.
    - cron: '0 2 * * *'

jobs:
  # Only meaningful for the nightly schedule: release/workflow_dispatch are
  # explicit requests to verify, so they always run the full suite.
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits since the last successful E2E run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(gh run list --workflow=e2e-verification.yml --status=success --branch="${{ github.ref_name }}" --limit=1 --json headSha --jq '.[0].headSha // empty')

          if [ -z "$LAST_SHA" ]; then
            echo "No prior successful run found; running E2E."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "Last successful run's commit ($LAST_SHA) isn't reachable from this checkout; running E2E to be safe."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git rev-list "$LAST_SHA"..HEAD --count)
            if [ "$CHANGED" -eq 0 ]; then
              echo "No commits since last successful run ($LAST_SHA); skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "$CHANGED commit(s) since last successful run ($LAST_SHA); running E2E."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  e2e-verification:
    needs: check-for-changes
    if: always() && !cancelled() && (github.event_name != 'schedule' || needs.check-for-changes.outputs.should_run == 'true')
    name: CI/e2e-verification (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.shardIndex }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Liferay Docker Manager (LDM)
        run: |
          wget https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux -O ldm
          chmod +x ldm
          sudo mv ldm /usr/local/bin/

      - name: Configure local hosts file
        run: |
          echo "127.0.0.1 aica-e2e.demo aicommerceacceleratorconfiguration.aica-e2e.demo aicommerceacceleratorfrontend.aica-e2e.demo ai-commerce-accelerator-microservice.aica-e2e.demo" | sudo tee -a /etc/hosts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Rebuild native modules
        run: |
          yarn workspace @liferay/liferay-ai-commerce-accelerator-microservice run pretest

      - name: Install mkcert & NSS (for LDM SSL)
        run: |
          sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
          mkcert -install
          mkdir -p /home/runner/liferay-docker-certs
          chmod 777 /home/runner/liferay-docker-certs

      - name: Free ports 80 and 443
        run: sudo fuser -k 80/tcp 443/tcp || true

      # Lightweight resource logging so a future failure (e.g. #445's cascading
      # connectivity failures ~50min into the run) comes with actual CPU/memory/
      # disk data instead of requiring another blind log-forensics pass.
      - name: Start background resource monitor
        run: |
          (
            while true; do
              {
                date -u +"%Y-%m-%dT%H:%M:%SZ"
                free -m
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}" 2>/dev/null || true
                df -h /
                echo "---"
              } >> resource-monitor.log
              sleep 60
            done
          ) &
          echo "$!" > resource-monitor.pid

      - name: Wake remote target node (if requested)
        run: |
          TARGET_NODE="${{ github.event.inputs.node_target || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'local' }}"
          if [ "$TARGET_NODE" != "local" ] && [ -n "$TARGET_NODE" ] && [ -f "./scripts/node_power.sh" ]; then
            echo "⚡ Waking remote target node '$TARGET_NODE'..."
            ./scripts/node_power.sh wake "$TARGET_NODE" 2h || true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'eu-north-1' }}

      - name: Start LDM and run tests
        run: |
          NODE_FLAG=""
          TARGET_NODE="${{ github.event.inputs.node_target || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'local' }}"
          if [ "$TARGET_NODE" != "local" ] && [ -n "$TARGET_NODE" ]; then
            NODE_FLAG="--node $TARGET_NODE"
          fi
          bash scripts/run-e2e-ldm.sh --ci $NODE_FLAG --shard "${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
        env:
          LIFERAY_USER: ${{ secrets.LIFERAY_USER }}
          LIFERAY_PASSWORD: ${{ secrets.LIFERAY_PASSWORD }}
          LIFERAY_OAUTH_CLIENT_ID: ${{ secrets.LIFERAY_OAUTH_CLIENT_ID }}
          LIFERAY_OAUTH_CLIENT_SECRET: ${{ secrets.LIFERAY_OAUTH_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Stop background resource monitor
        if: always()
        run: kill "$(cat resource-monitor.pid)" 2>/dev/null || true

      - name: Upload resource monitor log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-monitor-log-shard-${{ matrix.shardIndex }}
          path: resource-monitor.log
          retention-days: 7

      - name: Upload E2E Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-shard-${{ matrix.shardIndex }}
          path: |
            logs/
            client-extensions/*/logs/
            test-results/
            playwright-report/
          retention-days: 7

      - name: Sleep remote target node (mandatory cleanup)
        if: always()
        run: |
          TARGET_NODE="${{ github.event.inputs.node_target || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'local' }}"
          if [ "$TARGET_NODE" != "local" ] && [ -n "$TARGET_NODE" ] && [ -f "./scripts/node_power.sh" ]; then
            echo "💤 Returning remote target node '$TARGET_NODE' to sleep..."
            ./scripts/node_power.sh sleep "$TARGET_NODE" || true
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'eu-north-1' }}
