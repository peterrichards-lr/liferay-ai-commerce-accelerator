name: E2E Verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      node_target:
        description: 'LDM Target Node (local, aws-1, aws-2)'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - aws-1
          - aws-2
      ai_provider:
        description: 'Live AI provider. Choosing one spends money; none runs the pre-generated dataset.'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - openai
          - gemini
  schedule:
    # Nightly. Skipped automatically (see check-for-changes below) if
    # nothing has landed on the default branch since the last successful run,
    # so we're not burning ~1.5h of runner time verifying unchanged code.
    - cron: '0 2 * * *'

jobs:
  # Only meaningful for the nightly schedule: release/workflow_dispatch are
  # explicit requests to verify, so they always run the full suite.
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits since the last successful E2E run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(gh run list --workflow=e2e-verification.yml --status=success --branch="${{ github.ref_name }}" --limit=1 --json headSha --jq '.[0].headSha // empty')

          if [ -z "$LAST_SHA" ]; then
            echo "No prior successful run found; running E2E."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "Last successful run's commit ($LAST_SHA) isn't reachable from this checkout; running E2E to be safe."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git rev-list "$LAST_SHA"..HEAD --count)
            if [ "$CHANGED" -eq 0 ]; then
              echo "No commits since last successful run ($LAST_SHA); skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "$CHANGED commit(s) since last successful run ($LAST_SHA); running E2E."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Sharding is only safe while each shard owns its environment.
  #
  # Every shard runs the whole of run-e2e-ldm.sh, and under GITHUB_ACTIONS that
  # script names its project `aica-e2e` - the same name for all of them. That
  # was harmless while each shard ran on its own ephemeral runner: three
  # isolated Dockers, three projects that happened to share a name. Pointing
  # them at one compute node makes it three concurrent `ldm run aica-e2e`
  # against a single host, all waking it, all provisioning into it, and all
  # tearing it down on exit.
  #
  # So a remote target runs a single shard. The suite takes longer and is
  # correct; splitting it again would need a project name per shard and a node
  # with the headroom for three Liferays, which is a different piece of work.
  # See #1079.
  #
  # Resolved here rather than in the job so the target is derived once. #718
  # was two chains deriving it separately and disagreeing, which powered off an
  # instance the suite had never used.
  plan:
    runs-on: ubuntu-latest
    outputs:
      # The matrix only. The target itself cannot be passed this way: its value
      # equals secrets.LDM_NODE_TARGET, and a job output whose value matches a
      # secret is scrubbed on the way out, so the consuming job receives an
      # empty string. That is not hypothetical - it is what #1079 shipped, and
      # the run it produced reported itself as a single remote shard while
      # actually going local: no node woken, the MAC registration step skipped
      # by its own `if`, and the unqualified licence used instead of the node's.
      matrix: ${{ steps.plan.outputs.matrix }}
      # An opaque digest of the target, never the target itself. The name
      # equals secrets.LDM_NODE_TARGET and would be scrubbed to an empty string
      # on the way out (#1081); its digest does not match the secret, so it
      # survives. A concurrency key only has to be stable and unique, so a
      # digest serves as well as the name - and leaks nothing.
      node_key: ${{ steps.plan.outputs.node_key }}
    steps:
      - name: Resolve the target node and the shard plan
        id: plan
        env:
          REQUESTED_NODE: ${{ github.event.inputs.node_target || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'local' }}
        run: |
          TARGET="${REQUESTED_NODE:-local}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

          # Derived here, in the one place the target is resolved. Deriving it
          # again in the concurrency expression would be a second chain that
          # can disagree with this one, which is the defect behind #1081.
          if [ "$TARGET" = "local" ]; then
            echo "node_key=local" >> "$GITHUB_OUTPUT"
          else
            # sha256sum on the runners, shasum on macOS; the step has to give
            # the same answer wherever its guard runs it.
            if command -v sha256sum >/dev/null 2>&1; then
              NODE_DIGEST="$(printf '%s' "$TARGET" | sha256sum | cut -c1-12)"
            else
              NODE_DIGEST="$(printf '%s' "$TARGET" | shasum -a 256 | cut -c1-12)"
            fi
            echo "node_key=node-$NODE_DIGEST" >> "$GITHUB_OUTPUT"
          fi

          if [ "$TARGET" = "local" ]; then
            echo 'matrix={"shardIndex":[1,2,3],"shardTotal":[3]}' >> "$GITHUB_OUTPUT"
            echo "Target 'local': 3 shards, each on its own runner."
          else
            echo 'matrix={"shardIndex":[1],"shardTotal":[1]}' >> "$GITHUB_OUTPUT"
            echo "Target '$TARGET' is remote: 1 shard, because all shards share one node and one project name."
          fi

  e2e-verification:
    needs: [check-for-changes, plan]
    if: always() && !cancelled() && needs.plan.result == 'success' && (github.event_name != 'schedule' || needs.check-for-changes.outputs.should_run == 'true')
    name: CI/e2e-verification (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    # What two runs contend for is the node, not the ref. Keying on the ref let
    # a scheduled run on master and a dispatch from a branch take the same node
    # at once: different groups, one machine, one project name - the shape that
    # made three shards destroy each other in #1077, arriving by another route.
    #
    # Local keeps ref semantics, because there each shard owns a throwaway
    # runner and a newer push should supersede an older one. Remote serialises
    # on the node and *queues* rather than cancelling: a cancelled run can drop
    # its teardown mid-flight and leave a billable instance awake, and the
    # second run is one we want to happen, not discard.
    #
    # An empty node_key - the scrubbing failure this is built to avoid - groups
    # every run together and serialises everything. Slow, and safe.
    concurrency:
      group: ${{ github.workflow }}-${{ needs.plan.outputs.node_key == 'local' && format('{0}-{1}', github.ref, matrix.shardIndex) || needs.plan.outputs.node_key }}
      cancel-in-progress: ${{ needs.plan.outputs.node_key == 'local' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Resolved once for the whole job so wake, run and sleep are incapable of
      # naming different nodes. They previously each re-derived it, and the
      # sleep step's chain omitted secrets.LDM_NODE_TARGET - the one the nightly
      # actually uses - so it fell through to a literal 'aws-1' and powered off
      # an instance the suite had never touched, leaving the instance it did use
      # running and billable every night (#718).
      E2E_TARGET_NODE: ${{ github.event.inputs.node_target || vars.LDM_NODE_TARGET || secrets.LDM_NODE_TARGET || 'local' }}

    steps:
      # Two places now decide what the target is: the plan job, to choose a
      # shard count, and this job, to drive the run. They read the same chain,
      # but nothing forces them to agree - and the failure mode when they do
      # not is silent, because a job that believes it is local still runs.
      #
      # So assert the pair. One shard means remote; three means local. A
      # mismatch stops the run instead of quietly testing the wrong thing.
      - name: Check the shard plan and the target agree
        run: |
          if [ "$E2E_TARGET_NODE" = "local" ] || [ -z "$E2E_TARGET_NODE" ]; then
            EXPECTED=3
            DESCRIBED="local"
          else
            EXPECTED=1
            DESCRIBED="remote"
          fi

          if [ "${{ matrix.shardTotal }}" != "$EXPECTED" ]; then
            echo "::error::The shard plan and the target disagree. The target resolves as $DESCRIBED, which wants $EXPECTED shard(s), but the matrix was built for ${{ matrix.shardTotal }}. A job output carrying the target is scrubbed when its value matches a secret - see #1081."
            exit 1
          fi

          echo "Target is $DESCRIBED; ${{ matrix.shardTotal }} shard(s), as planned."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Liferay Docker Manager (LDM)
        run: |
          LDM_VER="${{ vars.LDM_VERSION || env.LDM_VERSION || 'latest' }}"
          if [ "$LDM_VER" = "latest" ]; then
            DOWNLOAD_URL="https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux"
          else
            DOWNLOAD_URL="https://github.com/peterrichards-lr/liferay-docker-manager/releases/download/${LDM_VER}/ldm-linux"
          fi
          echo "📥 Downloading LDM binary version '${LDM_VER}' from ${DOWNLOAD_URL}..."
          wget -q "$DOWNLOAD_URL" -O ldm
          chmod +x ldm
          sudo mv ldm /usr/local/bin/
          ldm --version

      - name: Configure local hosts file
        run: |
          echo "127.0.0.1 aica-e2e.demo aicommerceacceleratorconfiguration.aica-e2e.demo aicommerceacceleratorfrontend.aica-e2e.demo ai-commerce-accelerator-microservice.aica-e2e.demo" | sudo tee -a /etc/hosts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Rebuild native modules
        run: |
          yarn workspace @liferay/liferay-ai-commerce-accelerator-microservice run pretest

      - name: Install mkcert & NSS (for LDM SSL)
        run: |
          sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
          mkcert -install
          mkdir -p /home/runner/liferay-docker-certs
          chmod 777 /home/runner/liferay-docker-certs

      - name: Free ports 80 and 443
        run: sudo fuser -k 80/tcp 443/tcp || true

      # Lightweight resource logging so a future failure (e.g. #445's cascading
      # connectivity failures ~50min into the run) comes with actual CPU/memory/
      # disk data instead of requiring another blind log-forensics pass.
      - name: Start background resource monitor
        run: |
          (
            while true; do
              {
                date -u +"%Y-%m-%dT%H:%M:%SZ"
                free -m
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.BlockIO}}" 2>/dev/null || true
                df -h /
                echo "---"
              } >> resource-monitor.log
              sleep 60
            done
          ) &
          echo "$!" > resource-monitor.pid

      - name: Configure SSH Key for Remote Target Node
        run: |
          if [ "$E2E_TARGET_NODE" != "local" ] && [ -n "$E2E_TARGET_NODE" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            if [ -n "$SSH_KEY_DATA" ]; then
              echo "$SSH_KEY_DATA" > ~/.ssh/aws-key.pem
              chmod 600 ~/.ssh/aws-key.pem
              # Writing the key is not enough: only a caller passing `-i` can
              # use it at this path, and most callers here do not. LDM drives
              # Docker over SSH, which shells out to `ssh` carrying no identity
              # of its own, and manage_target_nodes.py's shutdown is a plain
              # `ssh user@host`. Both were told "refused the SSH credentials"
              # while a probe passing `-i` authenticated on the same host
              # seconds earlier.
              #
              # `Host *` rather than the node's address, because the address is
              # not known until after the wake and this runner is ephemeral with
              # a single SSH destination. Host key checking is off for the same
              # reason the readiness probe turns it off: a rebuilt instance
              # presents a new key, which otherwise fails in a way that reads
              # as refused credentials.
              {
                echo "Host *"
                echo "  IdentityFile ~/.ssh/aws-key.pem"
                echo "  IdentitiesOnly yes"
                echo "  StrictHostKeyChecking no"
                echo "  UserKnownHostsFile /dev/null"
                echo "  ConnectTimeout 10"
              } > ~/.ssh/config
              chmod 600 ~/.ssh/config

              echo "🔑 SSH key at ~/.ssh/aws-key.pem, named in ~/.ssh/config so callers that pass no identity can use it."
            else
              echo "⚠️ No EC2_SSH_KEY secret found in repository."
            fi
          fi
        env:
          SSH_KEY_DATA: ${{ secrets.EC2_SSH_KEY || secrets.LDM_SSH_KEY || secrets.AWS_SSH_KEY }}

      - name: Wake remote target node (if requested)
        # A failure here is fatal rather than advisory. The run that prompted
        # this change swallowed a power-on failure, then spent two hours
        # testing against a switched-off host and reported it as
        # "Liferay authentication is not configured" - an error that says
        # nothing about the actual cause.
        run: |
          if [ "$E2E_TARGET_NODE" = "local" ] || [ -z "$E2E_TARGET_NODE" ]; then
            echo "Running against a local environment; no target node to wake."
            exit 0
          fi

          if [ ! -f "./scripts/node_power.sh" ]; then
            echo "::error::Target node '$E2E_TARGET_NODE' was requested but scripts/node_power.sh is missing, so it cannot be powered on."
            exit 1
          fi

          echo "⚡ Waking remote target node '$E2E_TARGET_NODE'..."

          # 3h matches run-e2e-ldm.sh. The nightly finishes in 1h48m-1h58m and
          # has been doing so without running a single spec; a 2h TTL leaves no
          # room for the ~30 specs it is supposed to run, and the node powering
          # off mid-suite reports as a connectivity failure that names nothing.
          if ! ./scripts/node_power.sh wake "$E2E_TARGET_NODE" 3h; then
            echo "::error::Could not power on target node '$E2E_TARGET_NODE'. Failing now rather than running the suite against an unreachable host."
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # A runner's ~/.ldmrc starts empty, so `--node` has no target to resolve
      # and nothing carries a MAC. manage_target_nodes.py refreshes a woken
      # node's address but only `if node_name in targets` - it never creates
      # the entry. Without a configured MAC the container takes a bridge
      # address, the run exits 0, `License registered` appears in the log, and
      # the portal serves the Activation page (#805).
      #
      # After the wake, so the instance has an address to report.
      - name: Register the target node with its NIC MAC
        if: env.E2E_TARGET_NODE != 'local' && env.E2E_TARGET_NODE != ''
        run: node scripts/register-target-node.cjs "$E2E_TARGET_NODE" ~/.ssh/aws-key.pem
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        timeout-minutes: 5

      - name: Start LDM and run tests
        run: |
          NODE_FLAG=""
          if [ "$E2E_TARGET_NODE" != "local" ] && [ -n "$E2E_TARGET_NODE" ]; then
            NODE_FLAG="--node $E2E_TARGET_NODE"
          fi
          bash scripts/run-e2e-ldm.sh --ci $NODE_FLAG --shard "${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
        env:
          # run-e2e-ldm.sh makes its own node_power.sh calls (a fatal wake, and
          # the sleep in its EXIT trap). Without these they fail at the AWS CLI
          # with "Unable to locate credentials" - which is what the run in #718
          # did, twice per shard, every night.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LIFERAY_USER: ${{ secrets.LIFERAY_USER }}
          LIFERAY_PASSWORD: ${{ secrets.LIFERAY_PASSWORD }}
          LIFERAY_OAUTH_CLIENT_ID: ${{ secrets.LIFERAY_OAUTH_CLIENT_ID }}
          LIFERAY_OAUTH_CLIENT_SECRET: ${{ secrets.LIFERAY_OAUTH_CLIENT_SECRET }}
          # Base64 of an activation key. run-e2e-ldm.sh decodes it into the
          # project before `ldm run`; without it the portal serves its
          # activation page for every request and the suite fails four ways,
          # none of which names the cause (#805). Absent secret means no key is
          # deployed and the run behaves exactly as it did before.
          LIFERAY_LICENSE: ${{ secrets.LIFERAY_LICENSE }}
          # Activation keys are issued per machine, so each node needs its own.
          # The script reads LIFERAY_LICENSE_<TARGET> and falls back to the
          # unqualified one (#805).
          LIFERAY_LICENSE_AWS_1: ${{ secrets.LIFERAY_LICENSE_AWS_1 }}
          LIFERAY_LICENSE_AWS_2: ${{ secrets.LIFERAY_LICENSE_AWS_2 }}
          # Injected only when a dispatch explicitly names a provider.
          #
          # `dashboard.spec.js` gates Live (AI) Mode on whether a key is
          # present, and these were injected unconditionally - so the key was
          # always there, the spec never skipped, and every nightly generated
          # products against a real model. Presence of a credential was being
          # treated as permission to spend it.
          #
          # The permission is now the trigger. A schedule, a release and a
          # dispatch left at `none` carry no key, the spec skips itself, and the
          # suite exercises the pre-generated dataset - deterministic, free, and
          # a failure that means a regression rather than a model having a bad
          # day. Choosing a provider by hand is the act that authorises the
          # spend.
          #
          # Anthropic is absent deliberately: it is a supported provider with no
          # secret in this repository, so offering it would fail at the provider
          # rather than at the form.
          OPENAI_API_KEY: ${{ github.event.inputs.ai_provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          GEMINI_API_KEY: ${{ github.event.inputs.ai_provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}

      - name: Stop background resource monitor
        if: always()
        run: kill "$(cat resource-monitor.pid)" 2>/dev/null || true

      - name: Upload resource monitor log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-monitor-log-shard-${{ matrix.shardIndex }}
          path: resource-monitor.log
          retention-days: 7

      - name: Upload E2E Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs-shard-${{ matrix.shardIndex }}
          path: |
            logs/
            client-extensions/*/logs/
            test-results/
            playwright-report/
          retention-days: 7

      - name: Sleep remote target node (mandatory cleanup)
        if: always()
        run: |
          if [ "$E2E_TARGET_NODE" != "local" ] && [ -n "$E2E_TARGET_NODE" ]; then
            # Still never fails the job - cleanup must run even when the suite
            # has already failed, and an error annotation does not change the
            # job's conclusion - but a node that will not power off keeps
            # costing money, so surface it instead of discarding it.
            if ! ./scripts/node_power.sh sleep "$E2E_TARGET_NODE"; then
              echo "::error::Could not power off target node '$E2E_TARGET_NODE'. It may still be running and billable."
            fi
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
