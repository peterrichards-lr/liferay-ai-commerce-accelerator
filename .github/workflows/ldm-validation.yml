# Temporary. Validates two LDM fixes on the compute node and is then removed.
#
# The LDM project asked us to sign off LDM-#1894 (deploy resolving the node from
# project metadata) and LDM-#1891 (`ldm wait --probe-url`) before v2.25.0 is
# promoted. Their E2E suite has no node, and this repository's does - but ours
# cannot answer the question, because `ldm_cmd` appends `--node` to every call,
# so the metadata path the fix is about is never exercised.
#
# This runs the commands the way a user would: installed from the published
# release assets through install_verification.sh, and with no node named on the
# command line.
#
# It is not part of CI. Delete it once v2.25.0 is promoted.
name: LDM Validation (temporary)

on:
  workflow_dispatch:
    inputs:
      node_target:
        description: 'Compute node to validate against'
        required: true
        default: 'aws-2'
        type: choice
        options:
          - aws-1
          - aws-2
      ldm_tag:
        description: 'Release tag to validate'
        required: true
        default: 'v2.25.0-pre.3'
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    # Serialised against the E2E suite by hand rather than by key: this is a
    # temporary workflow, and reproducing that group here would be the second
    # chain that #1081 was about. Do not dispatch while an E2E run is in flight.
    timeout-minutes: 60
    env:
      PROJECT_NAME: ldm-validate
      TARGET_NODE: ${{ github.event.inputs.node_target }}
      LDM_TAG: ${{ github.event.inputs.ldm_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install LDM the way a user would
        run: |
          curl -fsSLO "https://github.com/peterrichards-lr/liferay-docker-manager/releases/download/${LDM_TAG}/install_verification.sh"
          sh install_verification.sh --tag "$LDM_TAG" --dir ./ldm-verification
          echo "$PWD/ldm-verification" >> "$GITHUB_PATH"

      - name: Record the environment the report has to state
        run: |
          echo "### Environment" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "ldm system version : $(./ldm-verification/ldm system version 2>&1 | head -1)"
            echo "runner OS          : $(uname -srm)"
            echo "runner docker      : $(docker --version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH for the node
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY_DATA" > ~/.ssh/aws-key.pem
          chmod 600 ~/.ssh/aws-key.pem
          {
            echo "Host *"
            echo "  IdentityFile ~/.ssh/aws-key.pem"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  ConnectTimeout 10"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY_DATA: ${{ secrets.EC2_SSH_KEY || secrets.LDM_SSH_KEY || secrets.AWS_SSH_KEY }}

      - name: Wake the node
        run: ./scripts/node_power.sh wake "$TARGET_NODE" 1h
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Register the node with its NIC MAC
        # The activation key is bound to the node's MAC; without this the
        # licence is refused and the boot never reaches a state worth
        # deploying into.
        run: node scripts/register-target-node.cjs "$TARGET_NODE" ~/.ssh/aws-key.pem

      - name: Boot a minimal project on the node
        run: |
          set -x
          ldm run "$PROJECT_NAME" --node "$TARGET_NODE" --sidecar --no-captcha \
            --jvm-args=-Xmx2560m -y --no-wait
        env:
          LIFERAY_LICENSE: ${{ secrets.LIFERAY_LICENSE }}
          LIFERAY_LICENSE_AWS_1: ${{ secrets.LIFERAY_LICENSE_AWS_1 }}
          LIFERAY_LICENSE_AWS_2: ${{ secrets.LIFERAY_LICENSE_AWS_2 }}

      # ---- LDM-#1891 -------------------------------------------------------
      - name: 'LDM-1891: ldm wait --probe-url, no node named'
        id: probe
        run: |
          echo "### LDM-#1891 — \`--probe-url\`" >> "$GITHUB_STEP_SUMMARY"
          NODE_IP=$(python3 -c "
          import json,pathlib
          d=json.loads(pathlib.Path('.node-power-config.json').read_text())
          print(d['nodes']['$TARGET_NODE'].get('host',''))")

          # A URL that is deliberately NOT the one LDM would derive. If the
          # override is ignored, LDM probes https://<node-ip> and this fails
          # naming that address - which is itself the answer.
          PROBE="https://${PROJECT_NAME}.demo"

          {
            echo "Derived URL would be: https://${NODE_IP}"
            echo "Override passed:      ${PROBE}"
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          ldm wait "$PROJECT_NAME" --probe-url "$PROBE" --timeout 120 2>&1 | tee probe.log
          echo "exit=$?" | tee -a probe.log
          set -e

          sed -e 's/\x1b\[[0-9;]*m//g' probe.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ---- LDM-#1894 -------------------------------------------------------
      - name: 'LDM-1894: ldm deploy with NO node argument'
        if: always()
        run: |
          echo "### LDM-#1894 — deploy resolving the node from project metadata" >> "$GITHUB_STEP_SUMMARY"

          printf 'validation artifact %s\n' "$GITHUB_RUN_ID" > ldm-validation-marker.txt
          zip -q ldm-validation-marker.zip ldm-validation-marker.txt

          {
            echo '```'
            echo '$ ldm deploy '"$PROJECT_NAME"' ldm-validation-marker.zip'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          ldm deploy "$PROJECT_NAME" ldm-validation-marker.zip 2>&1 | tee deploy.log
          DEPLOY_RC=${PIPESTATUS[0]}
          set -e

          sed -e 's/\x1b\[[0-9;]*m//g' deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo "exit=$DEPLOY_RC" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 'LDM-1894: confirm placement and ownership on the node'
        if: always()
        run: |
          NODE_IP=$(python3 -c "
          import json,pathlib
          d=json.loads(pathlib.Path('.node-power-config.json').read_text())
          print(d['nodes']['$TARGET_NODE'].get('host',''))")
          export DOCKER_HOST="ssh://ldm-automation@${NODE_IP}"

          {
            echo '**On the node** (`DOCKER_HOST='"$DOCKER_HOST"'`):'
            echo '```'
            echo '$ docker exec '"$PROJECT_NAME"' ls -l /opt/liferay/osgi/client-extensions /opt/liferay/osgi/modules'
          } >> "$GITHUB_STEP_SUMMARY"

          docker exec "$PROJECT_NAME" sh -c \
            'ls -l /opt/liferay/osgi/client-extensions /opt/liferay/osgi/modules 2>&1 | grep -i validation || echo "(marker not found in either directory)"' \
            2>&1 | tee placement.log >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down the project
        if: always()
        run: ldm rm "$PROJECT_NAME" --delete -y --node "$TARGET_NODE" || true

      - name: Sleep the node
        if: always()
        run: |
          if ! ./scripts/node_power.sh sleep "$TARGET_NODE"; then
            echo "::error::Could not power off '$TARGET_NODE'. It may still be billable."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldm-validation-logs
          path: |
            probe.log
            deploy.log
            placement.log
            local.log
          if-no-files-found: ignore
