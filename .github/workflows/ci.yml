name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  # `build-and-test` and `build-and-test-skip` deliberately share one display
  # name: branch protection requires the check `CI/build-and-test` by name, so
  # exactly one of them has to report on every pull request, whatever changed.
  # Renaming either job makes every pull request wait for a check that will
  # never report. The `suite-signal` job below is what tells the two apart.
  build-and-test:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    name: CI/build-and-test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Record that the full suite is running
        run: |
          {
            echo "## CI/build-and-test - full suite"
            echo
            echo "Files outside \`**/*.md\` and \`docs/**\` changed, so this run installs"
            echo "dependencies, lints, builds and runs the test suite. The result below is"
            echo "the result of all of that."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The secret scan compares this branch against its base, and the
          # default shallow clone has neither the base ref nor the merge base,
          # so the range would not resolve (#1001).
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          # The wrapper fetches gradle-8.5-bin.zip from an external host on
          # every run, with a 10s timeout and no retry. Two consecutive runs
          # died there - one read timeout, one HTTP 504 - having built nothing.
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --frozen-lockfile does not catch a member manifest that has drifted from
      # the lockfile: yarn resolves the new version, installs it nested, and
      # leaves yarn.lock untouched, so the install exits 0 (#920).
      - name: Lockfile must describe the manifests
        run: yarn lint:lockfile
        timeout-minutes: 2

      - name: Rebuild native modules
        run: |
          yarn workspace @liferay/liferay-ai-commerce-accelerator-microservice run pretest

      - name: Run Prettier Check
        run: yarn prettier --check .
        timeout-minutes: 5

      - name: Run ESLint
        run: yarn workspaces run eslint .
        timeout-minutes: 10

      - name: Run Markdown Lint
        run: yarn lint:md
        timeout-minutes: 5

      # `yarn lint` chains eslint, markdown, json, cx and lockfile, but CI runs
      # the pieces individually and these two were never added - so a duplicate
      # key in a manifest or an invalid client extension descriptor reached
      # master unchallenged, and only a developer running the full chain locally
      # would have seen it.
      - name: Run JSON Duplicate Key Check
        run: yarn lint:json
        timeout-minutes: 5

      - name: Run Client Extension Validation
        run: yarn lint:cx

      # The pre-commit hook is the only other place this runs, and a hook is
      # skippable - `--no-verify` is routine in a worktree, where there is no
      # node_modules for lint-staged. Nothing scanned a pull request before
      # this (#1001).
      #
      # `--range` rather than the default: on a runner nothing is staged, so
      # the index scan would report success over an empty set.
      - name: Scan the branch for leaked secrets
        run: |
          node scripts/detect-secrets.mjs \
            --range "origin/${{ github.base_ref || 'master' }}...HEAD"
        timeout-minutes: 5

      - name: Run Dependency Security Audit
        run: 'yarn audit --summary || echo "⚠️ Warning - Security vulnerabilities detected. Please run ''yarn audit'' locally to inspect."'
        timeout-minutes: 5

      - name: Build Workspace and Client Extensions
        run: ./gradlew build -x test
        timeout-minutes: 10

      - name: Run Unit Tests
        run: yarn test
        timeout-minutes: 15

  build-and-test-skip:
    needs: filter
    if: needs.filter.outputs.code != 'true'
    name: CI/build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Record that nothing was built
        run: |
          {
            echo "## CI/build-and-test - nothing was built"
            echo
            echo "Only \`**/*.md\` or \`docs/**\` files changed, so no dependency was"
            echo "installed, nothing was linted or built, and no test ran. This job exists"
            echo "only so the required \`CI/build-and-test\` check reports on every pull"
            echo "request; its green tick says nothing about the code."
            echo
            echo "The \`CI/suite-skipped\` check on this run carries the same fact in a name."
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check cannot say which of the two jobs above produced it, so
  # this one reports the same routing decision under a name that differs between
  # the two outcomes: `CI/suite-ran` or `CI/suite-skipped`. Neither name is a
  # required check, so nothing here changes what blocks a merge.
  suite-signal:
    needs: filter
    name: CI/suite-${{ needs.filter.outputs.code == 'true' && 'ran' || 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Describe the routing decision
        env:
          CODE_CHANGED: ${{ needs.filter.outputs.code }}
        run: |
          if [ "$CODE_CHANGED" = 'true' ]; then
            {
              echo "## CI/suite-ran"
              echo
              echo "The full \`CI/build-and-test\` job was started for this commit. Whether it"
              echo "passed is reported by that check, not this one."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## CI/suite-skipped"
              echo
              echo "Only \`**/*.md\` or \`docs/**\` files changed. \`CI/build-and-test\` reported"
              echo "success without installing, building or testing anything."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
