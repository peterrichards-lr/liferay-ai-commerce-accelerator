name: Refresh AI Models

# The shipped model list goes stale. AiConfigPanel carried claude-3-5-sonnet-20240620
# and Gemini 1.5 long after both were superseded, and Gemini had no entry at all
# despite being a selectable provider.
#
# This never commits to master. "No code changes between models" holds within a
# model family and not across one - Opus 5 rejects `temperature`, and budget_tokens
# became `thinking: {type: "adaptive"}` - so a new family needs a human to confirm
# the existing call shape still works before it is offered to operators.
#
# Requires the repository secrets OPENAI_API_KEY, ANTHROPIC_API_KEY and
# GEMINI_API_KEY. Listing models costs nothing, but the endpoints require
# authentication. A provider whose secret is absent, expired or unreachable keeps
# its existing entries rather than being emptied, so a partially configured
# repository still refreshes the providers it can. Because the secrets are
# required, this cannot run from a fork.

on:
  schedule:
    # Weekly, Monday morning UTC. Model catalogues do not move faster than this.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh AI Models
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # generateBatchFiles rebuilds 19-object-entry-ai-model-options from
      # ai-models.json, so the seed must be regenerated by Gradle rather than
      # hand-written - the two formats differ.
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Rebuild native modules
        run: |
          yarn workspace @liferay/liferay-ai-commerce-accelerator-microservice run pretest

      - name: Refresh the model list
        id: refresh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/refresh_ai_models.py 2>&1 | tee refresh-report.txt
          {
            echo 'report<<REPORT_EOF'
            cat refresh-report.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the batch seed
        run: ./gradlew generateBatchFiles

      - name: Format
        run: yarn prettier --write .

      - name: Verify
        run: |
          yarn workspaces run eslint .
          yarn lint:md
          yarn test

      - name: Detect changes
        id: diff
        run: |
          rm -f refresh-report.txt
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No model changes; nothing to open."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-ai-models
          delete-branch: true
          commit-message: 'chore(models): refresh the AI model list from provider catalogues'
          title: 'chore(models): refresh the AI model list from provider catalogues'
          labels: dependencies
          body: |
            Automated refresh of the shipped AI model list, opened by
            `.github/workflows/refresh-ai-models.yml`.

            **This is not a rubber stamp.** The assumption that models are
            interchangeable holds within a family and not across one — Opus 5
            rejects `temperature`, and `budget_tokens` became
            `thinking: {type: "adaptive"}`. Check that any newly offered family
            works with the existing call shape in `services/ai-providers/`
            before merging.

            A removed model may already be selected in a running install: the
            batch seed upserts `AI-MODEL-OPTIONS`, so a redeploy would take the
            option away from operators using it.

            ```
            ${{ steps.refresh.outputs.report || 'See the "Refresh the model list" step for the report.' }}
            ```

            Sources: Anthropic `GET /v1/models`, OpenAI `GET /v1/models`,
            Gemini `GET /v1beta/models`. A provider whose key is absent or
            unreachable keeps its existing entries rather than being emptied.
