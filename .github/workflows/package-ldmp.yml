name: LDM Package Release (.ldmp)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Git tag to attach/overwrite the packaged .ldmp to (e.g. v3.3.10)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package LDM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Liferay Docker Manager (LDM)
        run: |
          wget https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux -O ldm
          chmod +x ldm
          sudo mv ldm /usr/local/bin/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure local hosts file
        run: |
          echo "127.0.0.1 aica-e2e.demo aicommerceacceleratorconfiguration.aica-e2e.demo aicommerceacceleratorfrontend.aica-e2e.demo ai-commerce-accelerator-microservice.aica-e2e.demo" | sudo tee -a /etc/hosts

      - name: Free ports 80 and 443
        run: sudo fuser -k 80/tcp 443/tcp || true

      - name: Start Liferay LDM Stack
        run: bash scripts/run-e2e-ldm.sh -i -k --ci --no-ssl

      - name: Compile LDM Package
        run: |
          mkdir -p .liferay-docker
          cat << 'EOF' > .liferay-docker/ldmp-portal-ext.properties
          # AICA Layer 2 Package Feature Flags
          feature.flag.ui.visible[dev]=true
          feature.flag.LPS-178642=true
          feature.flag.LPS-168340=true
          EOF
          # Stop the stack first: LDM decides whether to bundle a database purely by
          # probing whether the DB container is RUNNING (snapshot/database.py uses
          # `docker ps -q -f name=^<db>$`). The `--files-only` flag is registered in
          # its CLI but read by no code path, so it cannot be used for this. See #551.
          ldm stop -p aica-e2e -y

          # Drop Liferay's data and state before snapshotting. cmd_snapshot calls
          # _dehydrate_named_volumes, which copies the <project>-data and
          # <project>-state Docker volumes back onto the host, and _create_archive
          # then tars `data` and `osgi/state` into files.tar.gz. That is what kept
          # v3.3.48 at ~1 GB despite carrying no database. Neither is needed: the
          # document library is meaningless without the database we deliberately
          # exclude, and OSGi state is rebuilt on first boot. `client-extensions`,
          # `osgi/modules`, `configs` and `files` are separate archive entries and
          # are unaffected. See #551.
          docker volume rm -f aica-e2e-data aica-e2e-state 2>/dev/null || true
          rm -rf aica-e2e/data aica-e2e/osgi/state

          # Take the snapshot explicitly so its meta can be enriched before packaging.
          ldm snapshot -p aica-e2e -y

          # `meta` is a JSON document written by LDM. Appending key=value lines to it
          # produces invalid JSON, which makes every key unreadable - including the
          # `tag` LDM records for the Liferay version the package was built against.
          # Merge into the parsed document instead.
          python3 - <<'PY'
          import json, pathlib

          # ldm package reads the meta from the SNAPSHOT directory, not the project
          # directory - handlers/snapshot.py step 3 does read_meta(latest_snap_dir).
          # Enriching aica-e2e/meta therefore never reaches the package. See #546.
          snapshots = sorted(
              d for d in pathlib.Path('aica-e2e/snapshots').iterdir() if d.is_dir()
          )
          if not snapshots:
              raise SystemExit('No snapshot directory found to enrich.')

          path = snapshots[-1] / 'meta'
          meta = json.loads(path.read_text())
          meta.update({
              "admin_email": "test@liferay.com",
              "banner_notes": [
                  "🚀 Welcome to the Liferay AI Commerce Accelerator!",
                  " ",
                  "💡 The AI Configuration panel is available via the Applications menu in the Global Site.",
                  "📚 For full documentation and setup instructions, visit the GitHub repository.",
                  " ",
              ],
              "credentials": [
                  {
                      "type": "admin",
                      "email": "test@liferay.com",
                      "password": "test",
                      "description": "Primary Administrator Account",
                  }
              ],
              "feature_flags": {"LPS-178642": True, "LPS-168340": True},
          })
          path.write_text(json.dumps(meta, indent=4, ensure_ascii=False) + "\n")
          print("Enriched meta; Liferay tag =", meta.get("tag"))
          PY
          # --use-latest packages the snapshot enriched above. It resolves via
          # backups[-1] from _list_backups, which sorts snapshot directories by name,
          # so timestamp names make it reliably the newest. Do not use
          # `--snapshot <name>`: that lookup compares against the directory name only,
          # so it can never match a meta name. See #551.
          ldm package aica-e2e --use-latest --repo ${{ github.repository }} --host-name aica.demo --ssl -y
          mv *.ldmp liferay-ai-commerce-accelerator.ldmp
          sha256sum liferay-ai-commerce-accelerator.ldmp | awk '{print $1}' > liferay-ai-commerce-accelerator.ldmp.sha256

      - name: Verify packaged metadata
        run: |
          # Fail the release rather than publish a package whose meta cannot be
          # parsed, or one that lost keys on the way through `ldm package --snapshot`.
          python3 - <<'PY'
          import json, pathlib, subprocess

          raw = subprocess.run(
              ["tar", "xzOf", "liferay-ai-commerce-accelerator.ldmp", "meta"],
              capture_output=True, check=True,
          ).stdout
          meta = json.loads(raw)
          required = ("tag", "admin_email", "banner_notes", "credentials", "feature_flags")
          missing = [key for key in required if key not in meta]
          if missing:
              raise SystemExit(f"Packaged meta is missing required keys: {missing}")

          # A truthy includes_database means the stack was still up when packaging
          # ran and a ~1 GB dump was bundled. Fail rather than publish it. See #551.
          if str(meta.get("includes_database", "")).lower() not in ("false", "none", ""):
              raise SystemExit(
                  f"Packaged meta reports includes_database={meta.get('includes_database')!r};"
                  " the stack was not stopped before packaging."
              )

          if str(meta.get("includes_volume_assets", "")).lower() not in ("false", "none", ""):
              raise SystemExit(
                  f"Packaged meta reports includes_volume_assets={meta.get('includes_volume_assets')!r};"
                  " Liferay data/state were captured into the archive."
              )

          members = subprocess.run(
              ["tar", "tzf", "liferay-ai-commerce-accelerator.ldmp"],
              capture_output=True, check=True, text=True,
          ).stdout.split()
          for unwanted in ("database.sql", "database.gz"):
              if unwanted in members:
                  raise SystemExit(f"Package contains {unwanted}; expected a database-free release asset.")

          # Guard the actual goal, not just its proxies. A database-free,
          # volume-free package is ~12 MB; anything approaching a gigabyte means
          # something bulky was captured that these assertions did not name.
          size = pathlib.Path("liferay-ai-commerce-accelerator.ldmp").stat().st_size
          if size > 250 * 1024 * 1024:
              raise SystemExit(f"Package is {size / 1024 / 1024:.0f} MB; expected well under 250 MB.")

          print("Packaged meta is valid JSON; Liferay tag =", meta["tag"])
          print(f"Package is {size / 1024 / 1024:.1f} MB; members:", ", ".join(members))
          PY

      - name: Teardown LDM Stack
        if: always()
        run: ldm rm aica-e2e --delete -y || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            liferay-ai-commerce-accelerator.ldmp
            liferay-ai-commerce-accelerator.ldmp.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
