name: LDM Package Release (.ldmp)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Git tag to attach/overwrite the packaged .ldmp to (e.g. v3.3.10)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package LDM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Liferay Docker Manager (LDM)
        run: |
          wget https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux -O ldm
          chmod +x ldm
          sudo mv ldm /usr/local/bin/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure local hosts file
        run: |
          echo "127.0.0.1 aica-e2e.demo aicommerceacceleratorconfiguration.aica-e2e.demo aicommerceacceleratorfrontend.aica-e2e.demo ai-commerce-accelerator-microservice.aica-e2e.demo" | sudo tee -a /etc/hosts

      - name: Free ports 80 and 443
        run: sudo fuser -k 80/tcp 443/tcp || true

      - name: Start Liferay LDM Stack
        run: bash scripts/run-e2e-ldm.sh -i -k --ci --no-ssl

      - name: Compile LDM Package
        run: |
          mkdir -p .liferay-docker
          cat << 'EOF' > .liferay-docker/ldmp-portal-ext.properties
          # AICA Layer 2 Package Feature Flags
          feature.flag.ui.visible[dev]=true
          feature.flag.LPS-178642=true
          feature.flag.LPS-168340=true
          EOF
          cat << 'EOF' >> aica-e2e/meta
          admin_email=test@liferay.com
          banner_notes=["🚀 Welcome to the Liferay AI Commerce Accelerator!", " ", "💡 The AI Configuration panel is available via the Applications menu in the Global Site.", "📚 For full documentation and setup instructions, visit the GitHub repository.", " "]
          credentials=[{"type": "admin", "email": "test@liferay.com", "password": "test", "description": "Primary Administrator Account"}]
          feature_flags={"LPS-178642": true, "LPS-168340": true}
          EOF
          # Package from a files-only snapshot so the release asset ships the client
          # extensions, OSGi modules and site initializer WITHOUT a database dump.
          # AICA installs against vanilla DXP: every component creates what it needs on
          # setup, so a bundled database.sql only ships pre-seeded demo data that goes
          # stale and inflates the asset from ~12 MB to ~1 GB.
          ldm snapshot -p aica-e2e --files-only -n aica-release -y
          ldm package aica-e2e --snapshot aica-release --repo ${{ github.repository }} --host-name aica.demo --ssl -y
          mv *.ldmp liferay-ai-commerce-accelerator.ldmp
          sha256sum liferay-ai-commerce-accelerator.ldmp | awk '{print $1}' > liferay-ai-commerce-accelerator.ldmp.sha256

      - name: Teardown LDM Stack
        if: always()
        run: ldm rm aica-e2e --delete -y || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            liferay-ai-commerce-accelerator.ldmp
            liferay-ai-commerce-accelerator.ldmp.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
