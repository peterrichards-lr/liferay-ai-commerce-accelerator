name: LDM Package Release (.ldmp)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Git tag to attach/overwrite the packaged .ldmp to (e.g. v3.3.10)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package LDM Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Liferay Docker Manager (LDM)
        run: |
          wget https://github.com/peterrichards-lr/liferay-docker-manager/releases/latest/download/ldm-linux -O ldm
          chmod +x ldm
          sudo mv ldm /usr/local/bin/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure local hosts file
        run: |
          echo "127.0.0.1 aica-e2e.demo aicommerceacceleratorconfiguration.aica-e2e.demo aicommerceacceleratorfrontend.aica-e2e.demo ai-commerce-accelerator-microservice.aica-e2e.demo" | sudo tee -a /etc/hosts

      - name: Free ports 80 and 443
        run: sudo fuser -k 80/tcp 443/tcp || true

      - name: Start Liferay LDM Stack
        run: bash scripts/run-e2e-ldm.sh -i -k --ci --no-ssl

      - name: Compile LDM Package
        run: |
          mkdir -p .liferay-docker
          cat << 'EOF' > .liferay-docker/ldmp-portal-ext.properties
          # AICA Layer 2 Package Feature Flags
          feature.flag.ui.visible[dev]=true
          feature.flag.LPS-178642=true
          feature.flag.LPS-168340=true
          EOF
          # Stop the stack first: LDM decides whether to bundle a database purely by
          # probing whether the DB container is RUNNING (snapshot/database.py uses
          # `docker ps -q -f name=^<db>$`). The `--files-only` flag is registered in
          # its CLI but read by no code path, so it cannot be used for this. See #551.
          ldm stop -p aica-e2e -y

          # Drop Liferay's data and state before snapshotting. cmd_snapshot calls
          # _dehydrate_named_volumes, which copies the <project>-data and
          # <project>-state Docker volumes back onto the host, and _create_archive
          # then tars `data` and `osgi/state` into files.tar.gz. That is what kept
          # v3.3.48 at ~1 GB despite carrying no database. Neither is needed: the
          # document library is meaningless without the database we deliberately
          # exclude, and OSGi state is rebuilt on first boot. `client-extensions`,
          # `osgi/modules`, `configs` and `files` are separate archive entries and
          # are unaffected. See #551.
          # Empty the volumes IN PLACE rather than removing them. `docker volume rm`
          # refuses while any container still references them, and `ldm stop` stops
          # containers without removing them - so the removal silently failed in
          # v3.3.49, dehydration repopulated `data`, and includes_volume_assets came
          # back true. Emptying via a throwaway mount has no such constraint.
          CNAME=$(python3 -c "import json; print(json.load(open('aica-e2e/meta')).get('container_name') or 'aica-e2e')")
          echo "Project container name: $CNAME"
          for target in data state; do
            vol="${CNAME}-${target}"
            if docker volume inspect "$vol" >/dev/null 2>&1; then
              echo "Emptying volume $vol"
              docker run --rm -v "$vol":/v alpine sh -c 'rm -rf /v/..?* /v/.[!.]* /v/* 2>/dev/null; true'
            else
              echo "Volume $vol not present"
            fi
          done
          rm -rf aica-e2e/data aica-e2e/osgi/state
          echo "--- host dirs after cleanup ---"
          du -sh aica-e2e/data aica-e2e/osgi/state 2>&1 || true

          # The harness runs `--sidecar`, so LDM wrote an EMBEDDED Elasticsearch
          # operationMode into files/portal-ext.properties. That file is restored on
          # the consumer's machine as `.liferay-docker/ldmp-portal-ext.properties`,
          # layer 2 of LDM's properties cascade, and `module.framework.properties.*`
          # outranks the OSGi config LDM writes for shared search - so a consumer
          # whose project resolved to shared search starts an Elasticsearch INSIDE
          # the Liferay container as well as the shared one. On 2026.q1.7-lts that
          # sidecar defaults to `-Xms1g -Xmx2g -XX:+AlwaysPreTouch`, which is what
          # takes an 8 GB machine over the edge. Strip it before snapshotting; LDM
          # re-derives the search topology from the consumer's own settings. See #563.
          node scripts/sanitize-ldm-package.cjs properties \
            aica-e2e/files/portal-ext.properties \
            aica-e2e/files/portal-ext.properties.bak

          # Take the snapshot explicitly so its meta can be enriched before packaging.
          ldm snapshot -p aica-e2e -y

          # ldm package reads the meta from the SNAPSHOT directory, not the project
          # directory - handlers/snapshot.py step 3 does read_meta(latest_snap_dir).
          # Enriching aica-e2e/meta therefore never reaches the package. See #546.
          # Sorting by name makes the newest last: LDM names them by timestamp.
          SNAPSHOT_DIR=$(ls -1d aica-e2e/snapshots/*/ 2>/dev/null | sort | tail -n 1)
          if [ -z "$SNAPSHOT_DIR" ]; then
            echo "No snapshot directory found to enrich." >&2
            exit 1
          fi
          export SNAPSHOT_DIR
          echo "Snapshot directory: $SNAPSHOT_DIR"

          # `meta` is a JSON document written by LDM. Appending key=value lines to it
          # produces invalid JSON, which makes every key unreadable - including the
          # `tag` LDM records for the Liferay version the package was built against.
          # Merge into the parsed document instead.
          python3 - <<'PY'
          import json, os, pathlib

          snapshot_dir = pathlib.Path(os.environ['SNAPSHOT_DIR'])
          path = snapshot_dir / 'meta'
          meta = json.loads(path.read_text())

          # LDM leaves client_extensions empty while includes_client_extensions is
          # true: _generate_snapshot_metadata derives has_cx from cx/, deploy/ and
          # the build dir, but cx_list from the build dir alone. run-e2e-ldm.sh puts
          # the zips in osgi/client-extensions, which only the first scan sees. Derive
          # the list from what files.tar.gz actually holds, so the manifest can never
          # claim an archive it does not ship. See #556.
          import tarfile

          def cx_zips(names):
              # tar member names appear with or without a leading './' depending on how
              # the archive was created; normalise rather than depend on the form.
              out = set()
              for name in names:
                  clean = name[2:] if name.startswith('./') else name
                  if clean.startswith('osgi/client-extensions/') and clean.endswith('.zip'):
                      out.add(pathlib.PurePosixPath(clean).name)
              return sorted(out)

          with tarfile.open(snapshot_dir / 'files.tar.gz', 'r:gz') as archive:
              shipped = cx_zips(archive.getnames())
          if not shipped:
              raise SystemExit('No client extension zips found in files.tar.gz.')
          print('Client extensions in archive:', ', '.join(shipped))
          meta.update({
              # `ldm package --host-name/--ssl` are accepted by the CLI and read by
              # no code path - cmd_package takes only project_id, output_dir, repo,
              # use_latest and snapshot. Left to itself the package therefore
              # inherits the CI harness's own settings, which run-e2e-ldm.sh creates
              # as aica-e2e.demo with SSL off via --no-ssl. Declare the intended
              # published values here instead. See #556.
              "host_name": "aica.demo",
              "ssl": "true",
              "client_extensions": ",".join(shipped),
              "includes_client_extensions": "true",
              "admin_email": "test@liferay.com",
              "banner_notes": [
                  "🚀 Welcome to the Liferay AI Commerce Accelerator!",
                  " ",
                  "💡 The AI Configuration panel is available via the Applications menu in the Global Site.",
                  "📚 For full documentation and setup instructions, visit the GitHub repository.",
                  " ",
              ],
              "credentials": [
                  {
                      "type": "admin",
                      "email": "test@liferay.com",
                      "password": "test",
                      "description": "Primary Administrator Account",
                  }
              ],
              "feature_flags": {"LPS-178642": True, "LPS-168340": True},
          })
          path.write_text(json.dumps(meta, indent=4, ensure_ascii=False) + "\n")
          print("Enriched meta; Liferay tag =", meta.get("tag"))
          PY
          # The snapshot captures the Liferay service's environment into custom_env,
          # which IS propagated to consumers on import: cmd_restore copies it into
          # their project meta and composer appends it to the Liferay service AFTER
          # its own search settings, so a key repeated here is the one Docker Compose
          # resolves to. It carries the harness's container hostname in
          # LIFERAY_ROUTES_CLIENT_EXTENSION_..._MICROSERVICE, which resolves nowhere
          # else, and its --sidecar search topology, which contradicts the mode the
          # consumer's project resolved to. See #563.
          node scripts/sanitize-ldm-package.cjs meta "${SNAPSHOT_DIR}meta"

          # --use-latest packages the snapshot enriched above. It resolves via
          # backups[-1] from _list_backups, which sorts snapshot directories by name,
          # so timestamp names make it reliably the newest. Do not use
          # `--snapshot <name>`: that lookup compares against the directory name only,
          # so it can never match a meta name. See #551.
          ldm package aica-e2e --use-latest --repo ${{ github.repository }} -y
          mv *.ldmp liferay-ai-commerce-accelerator.ldmp
          sha256sum liferay-ai-commerce-accelerator.ldmp | awk '{print $1}' > liferay-ai-commerce-accelerator.ldmp.sha256

      - name: Verify packaged metadata
        run: |
          # Every check this makes, and why each one exists, is in
          # scripts/verify-ldm-package.cjs. It used to be a heredoc here, which
          # meant the only way to run it was to push a tag; it is now unit
          # tested and can be pointed at any .ldmp on disk, including a
          # published one. See #996.
          node scripts/verify-ldm-package.cjs liferay-ai-commerce-accelerator.ldmp

      - name: Teardown LDM Stack
        if: always()
        run: ldm rm aica-e2e --delete -y || true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            liferay-ai-commerce-accelerator.ldmp
            liferay-ai-commerce-accelerator.ldmp.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
