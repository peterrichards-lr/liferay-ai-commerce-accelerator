version: 2
updates:
  # One ecosystem, at the root, deliberately.
  #
  # This is a yarn WORKSPACES monorepo with a single `yarn.lock`. Dependabot
  # runs per-directory, so an ecosystem declared for a workspace directory can
  # only touch that directory's `package.json` - there is no lockfile there,
  # and it will not reach the root one. Every such PR arrived with a manifest
  # asking for a version the lockfile did not pin, and
  # `scripts/check-lockfile-drift.cjs` failed it, correctly, every week.
  #
  # The root entry already covers every workspace dependency: a grouped root
  # PR updates all four manifests and the lockfile together. Three per-
  # directory entries were declared as well and produced nine unmergeable PRs
  # before anyone traced why a dependabot PR could never go green. See #1231.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Replaces Dependabot's defaults rather than adding to them, so
    # `dependencies` and `javascript` are listed to keep what it labelled
    # before. `no-issue-needed` is what `issue-link-check.yml` looks for - its
    # own help text names a dependabot bump as the case it exists for, and
    # nothing has ever applied it.
    labels:
      - 'dependencies'
      - 'javascript'
      - 'no-issue-needed'
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'codemirror'
      # msw was held here between #1231 and #1233, and the hold is gone
      # because the migration it was waiting for has landed. The rule it was
      # written for has not: a dev dependency the suite mocks THROUGH, rather
      # than merely uses, is breaking for us on a major even when it is not
      # breaking for the application, and a grouped PR is all-or-nothing, so
      # one of those holds back every safe update beside it. #1230 carried
      # twenty bumps and failed on one. Hold the next such major the same way,
      # by update-type rather than outright, so patches still arrive.
      # The SDK is pinned by git tag, and Dependabot compares those tags as
      # strings: it read v0.8.7 as newer than v0.8.20 and opened #907, a
      # thirteen-release downgrade. The pin only ever moves deliberately, as
      # part of releasing the SDK, so there is nothing here for it to propose.
      - dependency-name: '@liferay/accelerator-sdk'

  # The documentation toolchain, which arrived with the site in #1298.
  #
  # Dependabot found docs/requirements.txt on its own and began opening pull
  # requests against it the same day - but with no entry here to match, it fell
  # back to its own default labels, `dependencies` plus the language. The one
  # label that matters was missing, so issue-link-check.yml failed #1301 and
  # would have failed every pip bump after it. #1300 passes only because the
  # label was applied by hand. See #1305.
  #
  # Grouped for the same reason the npm entry is: a week of documentation
  # bumps is one reviewable pull request, not four.
  - package-ecosystem: 'pip'
    directory: '/docs'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
      - 'no-issue-needed'
    # mkdocs 2.0 removes the plugin system and rewrites theming: Material for
    # MkDocs warns that every plugin and theme override breaks, with no
    # migration path. This site depends on both - the alerts hook and
    # overrides/main.html - so a 2.x bump can only break it. Patch and minor
    # 1.x releases still come through. Revisit when Material supports mkdocs 2.
    # From the template's own dependabot.yml; see #1307 and the docs-site-standard
    # skill, rule 7.
    ignore:
      - dependency-name: 'mkdocs'
        versions: ['>= 2']
    groups:
      docs-toolchain:
        patterns:
          - '*'

  # The Semgrep engine, pinned in .github/semgrep/requirements.txt precisely so
  # that something watches it. Ungrouped and in its own directory: it is one
  # dependency, it is not part of the documentation toolchain above, and a
  # scanner bump is worth reading on its own because it can change what the
  # scan blocks. The job is no longer advisory, so that is now a real question
  # rather than a cosmetic one. See #1280.
  - package-ecosystem: 'pip'
    directory: '/.github/semgrep'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'python'
      - 'no-issue-needed'

  # The actions themselves, which nothing has ever watched here.
  #
  # Every `actions/checkout@v4` and `actions/setup-python@v5` in this
  # repository is pinned by major tag and unobserved - including the ones
  # #1298 and #1299 added. The SDK's config has carried this entry for some
  # time and says so in its own comments; this one simply never gained it.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'no-issue-needed'
    groups:
      github-actions:
        patterns:
          - '*'
