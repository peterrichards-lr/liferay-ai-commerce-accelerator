version: 2
updates:
  # One ecosystem, at the root, deliberately.
  #
  # This is a yarn WORKSPACES monorepo with a single `yarn.lock`. Dependabot
  # runs per-directory, so an ecosystem declared for a workspace directory can
  # only touch that directory's `package.json` - there is no lockfile there,
  # and it will not reach the root one. Every such PR arrived with a manifest
  # asking for a version the lockfile did not pin, and
  # `scripts/check-lockfile-drift.cjs` failed it, correctly, every week.
  #
  # The root entry already covers every workspace dependency: a grouped root
  # PR updates all four manifests and the lockfile together. Three per-
  # directory entries were declared as well and produced nine unmergeable PRs
  # before anyone traced why a dependabot PR could never go green. See #1231.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Replaces Dependabot's defaults rather than adding to them, so
    # `dependencies` and `javascript` are listed to keep what it labelled
    # before. `no-issue-needed` is what `issue-link-check.yml` looks for - its
    # own help text names a dependabot bump as the case it exists for, and
    # nothing has ever applied it.
    labels:
      - 'dependencies'
      - 'javascript'
      - 'no-issue-needed'
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'codemirror'
      # Majors only. A grouped PR is all-or-nothing, so one breaking change
      # holds back every safe update beside it - #1230 carried twenty bumps
      # and failed on one: msw 3.0.0 changed request interception, the
      # frontend handlers stopped matching, and AdminApp.test.jsx got
      # `ECONNREFUSED ::1:3001` where it expected a mocked response.
      #
      # Deliberately not ignoring msw outright. Patches and minors still
      # arrive; a major needs a handler migration, which belongs in its own PR
      # against its own issue rather than inside a dependency bump. The same
      # applies to any dev dependency the test suite mocks THROUGH rather than
      # merely uses - that is what makes a major breaking for us even when it
      # is not breaking for the application.
      - dependency-name: 'msw'
        update-types: ['version-update:semver-major']
      # The SDK is pinned by git tag, and Dependabot compares those tags as
      # strings: it read v0.8.7 as newer than v0.8.20 and opened #907, a
      # thirteen-release downgrade. The pin only ever moves deliberately, as
      # part of releasing the SDK, so there is nothing here for it to propose.
      - dependency-name: '@liferay/accelerator-sdk'
