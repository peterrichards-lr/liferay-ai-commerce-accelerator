include-and-override=portal-developer.properties

cache.filter.include.user.agent=false
com.liferay.portal.servlet.filters.cache.CacheFilter=false
passwords.default.policy.change.required=false
session.timeout=120
setup.wizard.enabled=false
terms.of.use.required=false
users.reminder.queries.enabled=false
default.admin.password=test
enterprise.product.notification.enabled=false

company.login.prepopulate.domain=false
company.security.strangers.with.mx=false
company.security.auto.login=false
company.security.strangers=false
company.security.strangers.verify=false
company.security.send.password.reset.link=false
company.security.update.password.required=false

layout.user.private.layouts.enabled=false
layout.user.private.layouts.auto.create=false
layout.user.public.layouts.enabled=false
layout.user.public.layouts.auto.create=false

field.enable.com.liferay.portal.kernel.model.Contact.male=false
field.enable.com.liferay.portal.kernel.model.Contact.birthday=false

session.timeout.auto.extend=true
session.timeout.auto.extend.offset=10

feature.flag.ui.visible[dev]=true

#Modern Image Formats
dl.file.entry.preview.image.mime.types=image/bmp,\
image/gif,\
image/jpeg,\
image/pjpeg,\
image/png,\
image/tiff,\
image/x-citrix-jpeg,\
image/x-citrix-png,\
image/x-ms-bmp,\
image/x-png,\
image/x-tiff,\
image/webp,\
image/avif

# Serving behind a TLS terminator, for a deployment that is not managed by
# LDM. Substitute your own host; these are commented out because the LDM
# path sets them itself and anything written here would be overwritten on
# the next compose render.
#web.server.protocol=https
#web.server.host=dxp.example.com
#web.server.http.port=-1
#web.server.https.port=443

#redirect.url.security.mode=domain
#redirect.url.domains.allowed=dxp.example.com

#company.security.auth.requires.https=false

# Loopback only. A project-specific host belongs in the deployment that
# serves it, not in a file published to everyone who clones this repository.
# Under LDM this line is inert regardless: _build_liferay_service regenerates
# `localhost,127.0.0.1,<host_name>,liferay` on every compose render.
virtual.hosts.valid.hosts=localhost,127.0.0.1