assemble:
  - include:
      - '**/*.cjs'
      - package.json
      # Everything below is read at runtime and was not assembled, so none of
      # it reached the container. Each failed differently and none said so:
      # the schemas ENOENT'd into a swallowed catch, leaving every response
      # unvalidated; the mock media threw MODULE_NOT_FOUND from a bare
      # require; the seed packs answered HTTP 400 "not found" for every pack;
      # and application.json's allow.list and OAuth application references
      # simply were not there. See #1131.
      #
      # Listed per directory rather than as '**/*.json', which would sweep in
      # tests/ fixtures, test.db and vitest-report-*.xml. `data/*.json` rather
      # than `data/**` for the same reason - the running service writes
      # workflows.db into that directory.
      - application.json
      - generation-schemas/*.json
      - data/*.json
      - resources/seed-packs/*.json
      - public/**
ai-commerce-accelerator-microservice:
  .serviceAddress: localhost:3001
  .serviceScheme: http
  name: Liferay AI Commerce Accelerator OAuth Application Headless Server
  scopes:
    - Liferay.Headless.Admin.User.everything
    # The ensure-categories step reads vocabularies and creates categories, so
    # the write scope is required rather than read. Without it the step fails
    # with "GraphQL Errors in taxonomyVocabularies ... HTTP 403 Forbidden" and
    # the session dies before any product is generated. See #646.
    - Liferay.Headless.Admin.Taxonomy.everything
    - Liferay.Headless.Batch.Engine.everything.read
    - Liferay.Headless.Admin.Address.everything
    - Liferay.Headless.Commerce.Admin.Catalog.everything
    - Liferay.Headless.Commerce.Admin.Channel.everything
    - Liferay.Headless.Commerce.Admin.Inventory.everything
    - Liferay.Headless.Commerce.Admin.Order.everything
    - Liferay.Headless.Commerce.Admin.Pricing.everything
    - Liferay.Headless.Delivery.everything
    - c_aicaconfiguration.everything
    # Needed to call the reindex endpoint provided by the search-reindex OSGi
    # module. Liferay scope-checks any JAX-RS application that declares no
    # oauth2.scope.checker.type, so without this the call is rejected with a
    # 403 before it reaches the module. The endpoint is POST-only, so the write
    # scope is sufficient. See #626.
    #
    # Formerly AICA.Reindex.everything.write. The module moved out of AICA into
    # the shared modules repository and its names were made generic, so the
    # scope follows osgi.jaxrs.name Custom.Search.Reindex.
    - Custom.Search.Reindex.everything.write
    # Read the portlet id Liferay composes for a client extension, provided by
    # the client-extension-entry module. No Liferay API outside the portal JVM
    # publishes it: GraphQL's ClientExtension type carries only
    # clientExtensionConfig and externalReferenceCode, and the id is assembled
    # at deploy time rather than stored. GET only, so the read scope is enough.
    # Derived from osgi.jaxrs.name Custom.Client.Extension.Entry.
    #
    # A missing grant here presents as a 403 with an empty body; a 403 with a
    # JSON body means the scope is fine and the caller lacks the Liferay
    # permission instead. See #660.
    - Custom.Client.Extension.Entry.everything.read
    # Read and set a commerce channel's B2B/B2C/B2X site type, provided by the
    # commerce-site-type module from liferay-custom-osgi-modules. Derived from
    # the application's osgi.jaxrs.name, Custom.Commerce.Site.Type - confirm it
    # against OAuth2 Administration if calls return 403 with an empty body,
    # which is how a missing scope presents. See #610.
    #
    # The write scope was not needed while the module was GET-only. v3.3.0
    # added PUT /channels/{channelId}/site-type, which AICA now calls, and the
    # read scope alone answers it with a 403 before the module sees it (#1045).
    - Custom.Commerce.Site.Type.everything.read
    - Custom.Commerce.Site.Type.everything.write
  type: oAuthApplicationHeadlessServer

# The identity an unattended `aica delete` or `aica config set` presents.
#
# Declared here rather than provisioned at run time because Liferay exposes no
# API for creating an OAuth2 application - no dynamic registration endpoint
# exists - so an application that must be present in every freshly built
# instance has to come from a client extension (#988).
#
# Deliberately minimal scopes. The token this application issues is never used
# to call Liferay: the microservice verifies its signature and reads the
# `grant_type` and `client_id` claims to decide whether the caller may act, and
# then uses its own credentials for the work itself. A scope granted here would
# be authority nothing exercises.
#
# Granting is separate from existing: the client id must also be named in
# AICA_ADMIN_CLIENTS on the service before this application can do anything.
ai-commerce-accelerator-cli-automation:
  name: Liferay AI Commerce Accelerator CLI Automation
  scopes:
    - Liferay.Headless.Admin.User.everything.read
  type: oAuthApplicationHeadlessServer
# The identity an operator presents when signing in from a terminal.
#
# `.serviceAddress` is the loopback listener the CLI binds during the
# authorization code flow, because Liferay derives the application's redirect
# URI from it. 127.0.0.1 rather than localhost: RFC 8252 s8.3 - localhost
# resolves through DNS and the hosts file and can be pointed elsewhere, the IP
# literal cannot.
#
# A fixed port, deliberately. RFC 8252 s7.3 recommends that servers accept any
# loopback port, but that is a recommendation, and an exact-match registration
# works whether or not a given server follows it. The CLI fails loudly when the
# port is busy rather than depending on behaviour nobody measured (#989).
ai-commerce-accelerator-cli-user-agent:
  .serviceAddress: 127.0.0.1:38017
  .serviceScheme: http
  name: Liferay AI Commerce Accelerator CLI User Agent
  scopes:
    - Liferay.Headless.Admin.User.everything.read
  type: oAuthApplicationUserAgent

ai-commerce-accelerator-microservice-user-agent:
  .serviceAddress: localhost:3001
  .serviceScheme: http
  name: Liferay AI Commerce Accelerator OAuth Application User Agent
  scopes:
    - Liferay.Headless.Admin.User.everything
    # The ensure-categories step reads vocabularies and creates categories, so
    # the write scope is required rather than read. Without it the step fails
    # with "GraphQL Errors in taxonomyVocabularies ... HTTP 403 Forbidden" and
    # the session dies before any product is generated. See #646.
    - Liferay.Headless.Admin.Taxonomy.everything
    - Liferay.Headless.Batch.Engine.everything.read
    - Liferay.Headless.Admin.Address.everything
    - Liferay.Headless.Commerce.Admin.Catalog.everything
    - Liferay.Headless.Commerce.Admin.Channel.everything
    - Liferay.Headless.Commerce.Admin.Inventory.everything
    - Liferay.Headless.Commerce.Admin.Order.everything
    - Liferay.Headless.Commerce.Admin.Pricing.everything
    - Liferay.Headless.Delivery.everything
    - c_aicaconfiguration.everything
  type: oAuthApplicationUserAgent
